    for (const id of ids){ const k = S.skus.get(id) || {}; rows.push([id, skuName(id), k.short_name ?? '', k.grp ?? '', k.cost ?? '', k.cost_pct ?? '', k.price ?? '', k.brand ?? '', k.role ? ROLES[k.role] : '', k.owner ?? '', k.stock ?? '', k.stock_at ?? '', k.lead_days ?? '']); }
    return downloadText(`danh-muc-${S.cfg.shop}.csv`, csvOf(rows), 'text/csv');
  }
  if (t.id === 'csvProfit'){
    const end = S.date, dates = winDates(end, S.pfRange, prodDates()[0]);
    const rows = [['Mã SP','Tên SP','Doanh số','Giá vốn','Phí sàn','Voucher shop','Ads','LN góp','% LN góp','ROAS thực','ROAS hoà vốn','TACoS']];
    for (const id of productIndex().keys()){ const p = profitRange(id, dates); if (!p.rev) continue; rows.push([id, skuName(id), Math.round(p.rev), Math.round(p.cogs), Math.round(p.fees), Math.round(p.vou), Math.round(p.ads), Math.round(p.lng), p.lngPct?.toFixed(4), p.roas?.toFixed(2) ?? '', p.be?.toFixed(2) ?? '', p.tacos?.toFixed(4)]); }
    return downloadText(`loi-nhuan-${S.cfg.shop}-${dates[0]}_${end}.csv`, csvOf(rows), 'text/csv');
  }
  if (ds.cmp){ S.cmp = ds.cmp; return render(); }
  if (ds.prange){ S.rng[S.gran] = +ds.prange; return render(); }
  if (ds.arange){ S.adsRange = +ds.arange; return render(); }
  if (ds.vrange){ S.vcRange = +ds.vrange; return render(); }
  if (ds.am){ S.adsMetric = ds.am; return render(); }
  if (ds.pid){ S.prodSel = ds.pid; S.tab = 'prod'; return render(); }
  if (ds.camp){ S.adsSel = ds.camp; render(); document.querySelector('.sec:last-of-type')?.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  if (ds.goprod){ S.prodSel = ds.goprod; S.tab = 'prod'; return render(); }
  if (ds.rmp != null){ S.pending.splice(+ds.rmp, 1); return render(); }
  if (ds.delchg){ if (!confirm('Xoá thay đổi này khỏi nhật ký?')) return; await Store.del('chg', ds.delchg); S.chg = S.chg.filter(c => c._id !== ds.delchg); toast('Đã xoá'); return render(); }
  if (ds.autosave != null){ const a = autoChanges()[+ds.autosave]; if (a) await addChange({ ...a, win:7 }); return; }
  if (ds.rawview){ const r = chk(await sb.from('sv_raw').select('*').eq('id', ds.rawview).single()); S.rawDetail = r; S.rawKind = null; render(); document.querySelector('main .sec:last-of-type')?.scrollIntoView({ behavior:'smooth' }); return; }
  if (ds.rawkind){ S.rawKind = ds.rawkind; return render(); }
  if (t.id === 'rawClose'){ S.rawDetail = null; return render(); }
  if (t.id === 'rawCopy'){
    const r = S.rawDetail, u = (() => { try { return new URL(r.url); } catch(e){ return null; } })();
    const arrays = findArrays(r.payload, '$', [], 0).slice(0, 6).map(a => ({ path: a.path, rows: a.arr.length,
      first: Object.fromEntries(Object.entries(flatObj(a.arr[0])).map(([k,v]) => [k, typeof v === 'string' ? v.slice(0,60) : v])),
      second: a.arr[1] ? Object.fromEntries(Object.entries(flatObj(a.arr[1])).filter(([k,v]) => typeof v === 'number').slice(0,40)) : null }));
    const sample = { id: r.id, source: r.source, kind: r.kind, page: r.page, path: u?.pathname, query: u ? Object.fromEntries(u.searchParams) : null,
      body: r.req_body ? String(r.req_body).slice(0, 1500) : null, captured_at: r.captured_at, status: r.status,
      topKeys: r.payload && typeof r.payload === 'object' ? Object.keys(r.payload.data || r.payload).slice(0, 40) : null, arrays };
    try { await navigator.clipboard.writeText(JSON.stringify(sample, null, 1)); t.textContent = 'Đã sao chép ✓'; } catch(err){ toast('Không sao chép được: ' + err.message); }
    return;
  }
  if (t.id === 'rawReload'){ S.rawList = null; return render(); }
  if (t.id === 'rawRebuild'){
    if (!confirm(`Xây lại toàn bộ số sản phẩm và quảng cáo của ${curShop().name} từ dữ liệu thô?\n\nSố đồng bộ cũ (kể cả số sai) sẽ bị xoá và tính lại bằng bộ đọc mới. Số nhập từ file không bị ảnh hưởng.`)) return;
    t.disabled = true;
    try { const x = await rebuildFromRaw(msg => { t.textContent = msg; }); clearCalcCache(); await loadShop(); S.rawList = null;
      toast(`Xong: ${x.lots} lô → ${x.days} ngày số liệu. ${x.moved} lô bị dời về đúng ngày, ${x.skipped} lô bỏ qua.`); }
    catch(err){ console.error(err); toast('Lỗi: ' + err.message); }
    return render();
  }
  if (t.id === 'rawProc'){ t.disabled = true; try { await processPendingRaw(); } catch(e){ toast(e.message); } return render(); }
  if (t.id === 'rawSave'){
    const date = document.getElementById('rawDate').value, shop = document.getElementById('rawShop').value;
    if (!date) return toast('Chọn ngày của số liệu');
    try { const x = await processRaw(S.rawDetail, { date, shop, kind: S.rawKind || S.rawDetail.kind || guessKind(S.rawDetail) }); toast(x.status === 'Đã lưu' ? `Đã lưu ${x.n} dòng vào ${dm(date)}` : x.status); S.rawList = null; S.rawDetail = null; }
    catch(e){ toast('Lưu thất bại: ' + e.message); }
    return render();
  }
  if (t.id === 'drop') return document.getElementById('fileIn').click();
  if (t.id === 'saveAll') return saveAll();
  if (t.id === 'clearPend'){ S.pending = []; return render(); }
  if (t.id === 'addChgHere'){ S.chgDraft = { pid:S.prodSel, date:S.date }; S.tab = 'chg'; return render(); }
  if (ds.dayview){ S.dayView = ds.dayview; return render(); }
  if (ds.pfview){ S.pfView = ds.pfview; return render(); }
  if (ds.affrange){ S.affRange = +ds.affrange; return render(); }
  if (t.id === 'cAdd'){
    const c = { date: document.getElementById('cDate').value, pid: document.getElementById('cPid').value, type: document.getElementById('cType').value, win: +document.getElementById('cWin').value || 7, note: document.getElementById('cNote').value.trim() };
    if (!c.date){ toast('Chọn ngày thay đổi'); return; }
    S.chgDraft = null; return addChange(c);
  }
  if (t.id === 'csvDay'){
    const D = S.date, X = cmpContext(D), ks = ['imp','clk','ctr','pv','atc','atcR','ord','cr','rev','adRev','affRev','cost','roas'];
    const rows = [['Kỳ','Mã SP / nhóm','Tên',...ks.map(k=>M[k].l),'LN góp']];
    for (const e of entRows(S.dayView)){ const x = ctxAgg(d => entDay(d, e.key), X.cur); if (!x) continue; rows.push([X.title, e.key, e.name, ...ks.map(k => x[k] == null ? '' : +x[k].toFixed(M[k].f==='pct'?4:2)), entProfitSum(e.key, X.cur) ?? '']); }
    return downloadText(`san-pham-${S.gran}-${D}.csv`, csvOf(rows), 'text/csv');
  }
  if (t.id === 'csvProd'){
    const id = S.prodSel, ks = ['imp','clk','ctr','pv','atc','atcR','ord','cr','rev','adRev','affRev','orgRev','adShare','cost','roas','acos','adOrd','affOrd','affCost'];
    const rows = [['Ngày',...ks.map(k=>M[k].l),'LN góp','Thay đổi']];
    for (const d of prodDates()){ const x = entDay(d,id); if (x) rows.push([d, ...ks.map(k => x[k] == null ? '' : +x[k].toFixed(M[k].f==='pct'?4:2)), entProfitDay(d,id) ?? '', S.chg.filter(c=>c.date===d&&(entIds(id).includes(c.pid)||c.pid===id)).map(c=>CHG_TYPES[c.type]?.l+': '+c.note).join(' | ')]); }
    return downloadText(`theo-ngay-${safeId(entName(id)).slice(0,40)}.csv`, csvOf(rows), 'text/csv');
  }
  if (t.id === 'delBtn'){
    const d = document.getElementById('delDate').value, k = document.getElementById('delKind').value;
    if (!d) return toast('Chọn ngày cần xoá');
    if (!confirm(`Xoá dữ liệu ${({ prod:'sản phẩm', ads:'quảng cáo', ord:'đơn hàng', aff:'affiliate' })[k]} ngày ${dm(d)}?`)) return;
    await Store.del(k, safeId(S.cfg.shop+'__'+d)); ({ prod:S.prod, ads:S.ads, ord:S.ord, aff:S.aff })[k].delete(d); toast('Đã xoá'); return render();
  }
  if (t.id === 'addShop'){
    const n = document.getElementById('newShop').value.trim(); if (!n) return;
    const id = safeId(norm(n).replace(/\s+/g,'-')).slice(0,40) || 'shop' + Date.now();
    if (S.cfg.shops.some(s => s.id === id)) return toast('Shop đã có');
    S.cfg.shops.push({ id, name:n }); S.cfg.shop = id; await saveCfg(); await loadShop(); toast('Đã thêm shop ' + n); return render();
  }
  if (t.id === 'renBtn'){ const n = document.getElementById('renShop').value.trim(); if (!n) return; const sh = S.cfg.shops.find(s => s.id === S.cfg.shop); sh.name = n; sh.shopee_shop_id = document.getElementById('shopeeId').value.trim() || null; await saveCfg(); toast('Đã lưu'); return render(); }
  if (t.id === 'bkOut'){
    const dump = { v:1, at:new Date().toISOString(), cfg:S.cfg };
    for (const k of ['prod','ads','ord','chg']) dump[k] = await Store.list(k);
    return downloadText(`so-van-hanh-san-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(dump), 'application/json');
  }
  if (t.id === 'bkIn') return document.getElementById('bkFile').click();
  if (t.id === 'themeBtn'){
    const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('svs-theme', r.dataset.theme); } catch(e){} return render();
  }
});
main.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'prodSel'){ S.prodSel = t.value; return render(); }
  if (t.dataset.sku != null){ const id = t.dataset.sku; S.skuDirty[id] = { ...(S.skuDirty[id] || {}), [t.dataset.f]: t.value }; const b = document.getElementById('skuSave'); if (b){ b.disabled = false; b.textContent = `Lưu ${Object.keys(S.skuDirty).length} thay đổi`; } t.style.borderColor = 'var(--pri)'; return; }
  if (t.id === 'skuFilter'){ S.skuFilter = t.value; return render(); }
  if (t.id === 'imgFile'){
    const f = t.files[0]; t.value = ''; if (!f || !S.imgTarget) return;
    try {
      const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(f); });
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const z = 160, c = document.createElement('canvas'), r = Math.min(z / img.width, z / img.height, 1); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      S.skuDirty[S.imgTarget] = { ...(S.skuDirty[S.imgTarget] || {}), image: c.toDataURL('image/jpeg', .82) };
      toast('Đã gắn ảnh — bấm Lưu để giữ');
    } catch(err){ toast('Không đọc được ảnh'); }
    return render();
  }
  if (t.id === 'skuFile'){ const f = t.files[0]; t.value = ''; if (!f) return; try { const n = await importSkus(f); toast(`Đã đọc ${n} dòng — kiểm tra rồi bấm Lưu`); } catch(err){ toast(err.message); } return render(); }
  if (t.id === 'evAuto'){ S.cfg.evAuto = t.checked; await saveCfg(); clearCalcCache(); return render(); }
  if (t.dataset.rmap != null || t.dataset.rscale != null){
    const kind = S.rawKind || S.rawDetail.kind || guessKind(S.rawDetail);
    S.cfg.rov ||= {}; S.cfg.rov[kind] ||= { map:{}, scale:{} }; S.cfg.rov[kind].map ||= {}; S.cfg.rov[kind].scale ||= {};
    if (t.dataset.rmap != null) S.cfg.rov[kind].map[t.dataset.rmap] = t.value; else S.cfg.rov[kind].scale[t.dataset.rscale] = +t.value;
    S.rawOpenMap = true; await saveCfg(); return render();
  }
  if (t.id === 'cType'){ document.getElementById('cWin').value = CHG_TYPES[t.value]?.win || 7; return; }
  if (t.dataset.pdate != null){ S.pending[+t.dataset.pdate].date = t.value; return render(); }
  if (t.dataset.ov != null){
    const i = +t.dataset.ov, p = S.pending[i];
    const ovIdx = { ...(p.ovIdx || {}) }; ovIdx[t.dataset.field] = t.value;
    const keepDate = p.date;
    const np = buildPending(p.file, p.rawRows, ovIdx); if (np.type !== 'ord') np.date = keepDate || np.date;
    S.pending[i] = np; return render();
  }
  if (t.id === 'fileIn'){ await ingest([...t.files]); t.value = ''; return; }
  if (t.id === 'bkFile'){
    const f = t.files[0]; if (!f) return;
    try{
      const dump = JSON.parse(await f.text());
      if (!confirm('Khôi phục sẽ ghi các bản ghi trong file sao lưu vào kho hiện tại. Tiếp tục?')) return;
      let n = 0;
      for (const k of ['prod','ads','ord','chg']) for (const r of (dump[k] || [])){ const id = r._id; delete r._id; await Store.put(k, id, r); n++; }
      if (dump.cfg){ S.cfg = { ...S.cfg, ...dump.cfg }; await saveCfg(); }
      await loadShop(); toast(`Đã khôi phục ${n} bản ghi`); render();
    }catch(err){ toast('File sao lưu không hợp lệ'); }
    t.value = '';
  }
});
main.addEventListener('dragover', e => { const d = e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.add('on'); } });
main.addEventListener('dragleave', e => { const d = e.target.closest('#drop'); if (d) d.classList.remove('on'); });
main.addEventListener('drop', e => { const d = e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.remove('on'); ingest([...e.dataTransfer.files]); } });
main.addEventListener('keydown', e => { if (e.target.id === 'drop' && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); document.getElementById('fileIn').click(); } });

async function ingest(files){
  if (typeof XLSX === 'undefined'){ toast('Chưa tải được thư viện đọc Excel, kiểm tra mạng rồi tải lại trang'); return; }
  for (const f of files){
    try { S.pending.push(await readFile(f)); }
    catch(err){ console.error(err); S.pending.push({ file:f.name, err:'Không mở được file: ' + err.message }); }
  }
  render();
}
async function addChange(c){
  const id = safeId(S.cfg.shop + '__' + Date.now());
  const rec = { shop:S.cfg.shop, date:c.date, pid:c.pid, type:c.type, win:c.win, note:c.note || '', at:Date.now() };
  try{ await Store.put('chg', id, rec); S.chg.push({ _id:id, ...rec }); toast('Đã lưu thay đổi'); }
  catch(e){ toast('Lưu thất bại: ' + (e.message || e.code)); }
  render();
}

/* =====================================================================
   KHỞI ĐỘNG
   ===================================================================== */
async function afterLogin(){
  document.getElementById('main').innerHTML = '<div class="empty">Đang đồng bộ dữ liệu…</div>';
  try{
    const c = await Store.get('cfg'); if (c) S.cfg = { ...S.cfg, ...c };
    await loadShop();
    if (!S.prod.size && !S.ads.size && !S.ord.size){ S.tab = 'data'; S.dataSub = 'raw'; }
    render();
    const x = await processPendingRaw(true);
    if (x.saved){ await loadShop(); render(); }
  }catch(e){ console.error(e); document.getElementById('main').innerHTML = `<section class="sec"><div class="empty"><b>Không kết nối được Supabase</b>${esc(e.message)}<br>Kiểm tra đã chạy file supabase.sql chưa.</div></section>`; }
}
(async function boot(){
  try { const th = localStorage.getItem('svs-theme'); if (th) document.documentElement.dataset.theme = th; const g = localStorage.getItem('svs-gran'); if (g) S.gran = g; } catch(e){}
  await Store.init();
  if (!sb){ render(); return; }
  const { data } = await sb.auth.getSession();
  S.user = data.session?.user || null;
  if (!S.user){ render(); return; }
  await afterLogin();
  // dữ liệu extension mới: kiểm tra lại mỗi khi quay lại tab
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !S.user) return;
    try { const x = await processPendingRaw(true); if (x.saved){ Store.mem = {}; await loadShop(); render(); } } catch(e){}
  });
})();
</script>
