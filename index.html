<style>
:root{
  /* "Sổ" — giấy xám xanh, mực navy, xanh sổ cái; vàng hổ phách cho mốc thay đổi */
  --bg:#EDF1F3; --panel:#FFFFFF; --panel2:#F5F8F9; --rail:#F8FAFB;
  --ink:#14213D; --ink2:#46546B; --ink3:#7E8A9C;
  --line:#DCE3E8; --line2:#E9EEF1; --rule:#14213D;
  --pri:#0F6B5C; --pri-ink:#0B5246; --pri-soft:#E2F1EC;
  --up:#13795B; --up-soft:#E3F3EC; --down:#C2412D; --down-soft:#FBE8E4;
  --flag:#B7791F; --flag-soft:#FCF1DC; --muted-soft:#EEF2F5;
  --s1:#0F6B5C; --s2:#4C5FD5; --s3:#D08A1E; --s4:#B4436C;
  --r-panel:10px; --r-ctl:7px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F161D; --panel:#151F28; --panel2:#1A2631; --rail:#121B23; --ink:#E7EDF3; --ink2:#AAB7C4; --ink3:#788796;
    --line:#26333F; --line2:#1F2B36; --rule:#E7EDF3; --pri:#4FC1A8; --pri-ink:#7ED6C2; --pri-soft:#173A33;
    --up:#4CC795; --up-soft:#16332A; --down:#F0806F; --down-soft:#3B211E; --flag:#E6B04F; --flag-soft:#3A2E16; --muted-soft:#1E2A35;
    --s1:#4FC1A8; --s2:#8D9BF2; --s3:#E6B04F; --s4:#E07AA6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161D; --panel:#151F28; --panel2:#1A2631; --rail:#121B23; --ink:#E7EDF3; --ink2:#AAB7C4; --ink3:#788796;
  --line:#26333F; --line2:#1F2B36; --rule:#E7EDF3; --pri:#4FC1A8; --pri-ink:#7ED6C2; --pri-soft:#173A33;
  --up:#4CC795; --up-soft:#16332A; --down:#F0806F; --down-soft:#3B211E; --flag:#E6B04F; --flag-soft:#3A2E16; --muted-soft:#1E2A35;
  --s1:#4FC1A8; --s2:#8D9BF2; --s3:#E6B04F; --s4:#E07AA6; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13.5px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
a{color:var(--pri)}

/* ---------- khung: thanh điều hướng trái + nội dung ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto}
.logo{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:-.02em}
:root[data-theme="dark"] .logo .mark{color:#0F161D}
.logo b{display:block;font-size:14.5px;letter-spacing:-.01em}
.logo small{color:var(--ink3);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .ng{font-size:11.5px;color:var(--ink3);padding:14px 10px 5px;font-weight:500}
.nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:13.5px}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav button:hover{background:var(--muted-soft);color:var(--ink)}
.nav button[aria-selected=true]{background:var(--pri-soft);color:var(--pri-ink);font-weight:600}
.nav button[aria-selected=true] svg{opacity:1}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line2);font-size:12px;color:var(--ink3);word-break:break-all}
.side-foot button{min-height:0;padding:0;border:0;background:none;color:var(--pri);cursor:pointer;font-size:12px}
.content{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1720px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px 28px;flex-wrap:wrap}
.ptitle h1{font-size:21px;line-height:1.2;margin:0;font-weight:650;letter-spacing:-.015em}
.ptitle span{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}
.top-ctl{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.ctl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
select,input[type=date],input[type=text],input[type=number],input[type=password],textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-ctl);padding:6px 9px;min-height:34px}
select:hover,input:hover{border-color:color-mix(in srgb,var(--ink3) 50%,var(--line))}
textarea{width:100%;min-height:60px;resize:vertical}
main{max-width:1720px;width:100%;margin:0 auto;padding:22px 28px 64px}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .logo{padding:0 8px 0 0}.logo div{display:none}
  .nav{flex-direction:row}.nav .ng{display:none}.nav button{white-space:nowrap;padding:7px 10px}
  .side-foot{display:none}
  .top-in,main{padding-left:12px;padding-right:12px}
}

/* ---------- khối nội dung ---------- */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);margin-bottom:18px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.sec-h h2{font-size:14.5px;margin:0;font-weight:650;letter-spacing:-.005em}
.sec-h .hint{color:var(--ink3);font-size:12.5px}
.sec-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-b{padding:14px 18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-ctl);padding:6px 12px;cursor:pointer;min-height:34px;font-weight:500}
.btn:hover{background:var(--panel2);border-color:color-mix(in srgb,var(--ink3) 40%,var(--line))}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-ink)}
:root[data-theme="dark"] .btn.pri{color:#0F161D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0F161D}}
.btn.sm{padding:3px 10px;min-height:30px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.danger{color:var(--down)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.seg{display:inline-flex;background:var(--muted-soft);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-size:12.5px;color:var(--ink2);min-height:28px;border-radius:6px;font-weight:500}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.seg.big button{padding:6px 14px;font-size:13px;min-height:32px}
.muted{color:var(--ink3)}
.empty{padding:36px 18px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* ---------- bảng ---------- */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{font-weight:600;font-size:12px;color:var(--ink2);background:var(--panel);position:sticky;top:0;border-bottom:1.5px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tbody tr:hover td{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
.pname{max-width:300px;overflow:hidden;text-overflow:ellipsis;display:block;font-weight:500;color:var(--ink)}
.pid{display:block;font-size:11.5px;color:var(--ink3)}
.v{display:block}
.d,.dd{display:block;font-size:11px;font-weight:600;line-height:1.3;margin-top:1px}
.d.up,.dd.up{color:var(--up)} .d.down,.dd.down{color:var(--down)}
.d.flat,.dd.flat,.d.neu,.dd.neu{color:var(--ink3);font-weight:500}
.kpi-d .d{display:inline}
tr.total td{font-weight:600;background:var(--panel2)}
tr.dl td{color:var(--ink3);font-size:12.5px}
.flag{display:inline-block;background:var(--flag-soft);color:var(--flag);border-radius:4px;font-size:11px;font-weight:600;padding:0 6px;margin:2px 3px 0 0;white-space:nowrap}
.chip{display:inline-block;border-radius:4px;font-size:12px;font-weight:600;padding:1px 7px}
.chip.up{background:var(--up-soft);color:var(--up)} .chip.down{background:var(--down-soft);color:var(--down)}
.chip.wait{background:var(--muted-soft);color:var(--ink2)} .chip.flag{background:var(--flag-soft);color:var(--flag)}
.chip.muted{background:none}
tr.chg td:first-child{box-shadow:inset 3px 0 0 var(--flag)}
tr.chg td{background:color-mix(in srgb,var(--flag-soft) 50%,transparent)}
.wk{color:var(--ink3);font-size:11.5px;margin-left:6px;font-weight:400}
.tags{display:block}

/* ---------- dải KPI: một khối, chia bằng đường kẻ (không phải nhiều thẻ rời) ---------- */
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);margin-bottom:8px;overflow:hidden}
.kpi{padding:14px 18px 10px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);position:relative;min-height:112px;display:flex;flex-direction:column}
.kpi-l{font-size:12.5px;color:var(--ink2);font-weight:500}
.kpi-v{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.25;margin-top:4px}
.kpi-d{font-size:12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:2px}
.kpi-d .d{font-size:12.5px}
.kpi-n{color:var(--ink3)}
.kspark{width:100%;height:26px;margin-top:auto;opacity:.9}
.kgrid .kpi:nth-child(4n){border-right:0}
@media (max-width:1100px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))} .kgrid .kpi:nth-child(4n){border-right:1px solid var(--line2)} .kgrid .kpi:nth-child(2n){border-right:0}}
.ctxline{margin:0 2px 16px;color:var(--ink2);font-size:12.5px}
.ctxline b{color:var(--ink);font-weight:600}

/* ---------- cảnh báo ---------- */
.alerts{display:grid;gap:8px}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--line)}
.al.bad{border-left-color:var(--down)} .al.good{border-left-color:var(--up)} .al.info{border-left-color:var(--flag)}
.al b{font-weight:600}

/* ---------- biểu đồ ---------- */
.charts{display:grid;gap:2px}
.ch{border-bottom:1px solid var(--line2);padding:8px 0 4px}
.ch:last-child{border-bottom:0}
.ch-t{display:flex;gap:16px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.ch-t i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:6px}
svg.c{width:100%;height:auto;display:block}
svg.c text{font-family:inherit;fill:var(--ink3);font-size:11px}
svg.c .grid{stroke:var(--line2)}
svg.c .mk{stroke:var(--flag);stroke-width:1.5;stroke-dasharray:4 3}
svg.c .mkl{fill:var(--flag);font-weight:700}
svg.c .hit{fill:transparent}
svg.c .hit:hover{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.mx td.cell{min-width:66px;font-size:12.5px}
.mx td.cell span{display:block;font-size:11px;color:var(--ink3)}
.mx td.cell span.neg{color:var(--down)}

/* ---------- biểu mẫu & nhập liệu ---------- */
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.grid-f label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.grid-f .wide{grid-column:1/-1}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:26px;text-align:center;cursor:pointer;background:var(--panel2)}
.drop:hover,.drop.on{border-color:var(--pri);background:var(--pri-soft)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.fcard{border:1px solid var(--line);border-radius:8px;margin-top:12px}
.fcard-h{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.fcard-b{padding:10px 12px;display:grid;gap:8px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--pri-soft);color:var(--pri-ink)}
.tag.err{background:var(--down-soft);color:var(--down)}
.map{display:flex;flex-wrap:wrap;gap:6px}
.map span{font-size:12px;padding:2px 7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line2)}
.map span.miss{color:var(--down);border-color:color-mix(in srgb,var(--down) 35%,transparent)}
details summary{cursor:pointer;color:var(--pri);font-size:12.5px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px}
.cal div{border:1px solid var(--line2);border-radius:6px;padding:4px 5px;font-size:11.5px;text-align:center}
.cal i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 1px;background:var(--line)}
.cal i.p{background:var(--s1)} .cal i.a{background:var(--s2)} .cal i.o{background:var(--s3)}
.steps{margin:0;padding-left:20px;color:var(--ink2)} .steps li{margin:3px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:9px;font-weight:500;z-index:50;max-width:90vw}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two > .sec{margin-bottom:18px}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.store{font-size:12px;color:var(--ink3)} .store b{color:var(--ink2);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v1.7 — chọn chỉ số, KPI tháng, dữ liệu theo ngày */
.picker{position:relative;display:inline-block}
.picker > .btn{display:inline-flex;gap:6px;align-items:center}
.picker > .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.pick-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:min(560px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(20,33,61,.16);padding:14px 16px;text-align:left}
.pick-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pick-g{display:grid;grid-template-columns:90px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line2)}
.pick-g > span{font-size:12px;color:var(--ink3);padding-top:3px}
.pick-g > div{display:flex;flex-wrap:wrap;gap:4px 14px}
.pick-g label{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;white-space:nowrap}
.pick-g input[type=checkbox]{accent-color:var(--pri);width:15px;height:15px}
.pick-f{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.kbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 8px;flex-wrap:wrap;font-size:12.5px}
.mini-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;font-size:12.5px;flex-wrap:wrap}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 18px}
.mini{border-top:1px solid var(--line2);padding-top:8px}
.mini-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink2)}
.mini-h b{font-size:15px;color:var(--ink)}
.kmonth{overflow:visible}
.kmonth-h{display:flex;gap:12px;align-items:center;padding:14px 18px;cursor:pointer;flex-wrap:wrap}
.kmonth-h:hover{background:var(--panel2)}
.kmonth.open .kmonth-h{border-bottom:1px solid var(--line2)}
.chev{width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:2;transition:transform .15s}
.open > .kmonth-h .chev,.rgroup.open .chev{transform:rotate(90deg)}
.kmonth-t b{font-size:15.5px;display:block}
.kmonth-t span{font-size:12.5px;color:var(--ink3)}
.kmonth-s{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:12.5px}
.kscore{font-size:20px;font-weight:700;padding:2px 10px;border-radius:8px}
.kscore.up{background:var(--up-soft);color:var(--up)} .kscore.flag{background:var(--flag-soft);color:var(--flag)} .kscore.down{background:var(--down-soft);color:var(--down)} .kscore.wait{background:var(--muted-soft);color:var(--ink3)}
.kweeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border:1px solid var(--line2);border-radius:9px;overflow:hidden;margin-bottom:14px}
.kweek{padding:10px 14px;border-right:1px solid var(--line2);display:flex;flex-direction:column;gap:1px}
.kweek:last-child{border-right:0}
.kweek span{font-weight:600;font-size:13px} .kweek small{color:var(--ink3);font-size:11.5px}
.kweek b{font-size:20px;margin-top:4px} .kweek.future{background:var(--panel2)}
.flagc{color:var(--flag)}
.kactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.kitem{border:1px solid var(--line);border-radius:9px;margin-bottom:12px;overflow:hidden}
.kitem-h{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line2)}
.shopico{display:grid!important;place-items:center;font-weight:700;color:var(--pri);width:36px;height:36px}
.ktbl th.wk-col,.ktbl td.wk-col{border-left:1px solid var(--line2);min-width:96px}
.ktbl th.wk-col span,.ktbl td.wk-col span{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.wp{font-weight:700!important;font-size:12px!important}
.wp.up{color:var(--up)!important} .wp.flag{color:var(--flag)!important} .wp.down{color:var(--down)!important} .wp.wait{color:var(--ink3)!important}
.kedit{padding:14px;border-bottom:1px solid var(--line2);background:color-mix(in srgb,var(--pri-soft) 35%,var(--panel))}
.kedit .grid-f{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpick .pick-g > div{gap:6px 8px}

<script>
"use strict";
/* =====================================================================
   CORE: chuẩn hoá, parse số / ngày, nhận diện cột
   ===================================================================== */
const norm = s => String(s ?? '').replace(/[đĐ]/g,'d').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const inc = (h,...w) => w.every(x => h.includes(x));
const exc = (h,...w) => w.every(x => !h.includes(x));

function num(v, loc='vi'){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim();
  if (!s || s === '-' || s === '--' || s === 'N/A') return null;
  s = s.replace(/%|₫|đ|VND|vnd|\s/g,'');
  const hasDot = s.includes('.'), hasCom = s.includes(',');
  if (hasDot && hasCom){
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.');
    else s = s.replace(/,/g,'');
  } else if (hasCom){
    if (/^-?\d{1,3}(,\d{3}){2,}$/.test(s) || (loc==='en' && /^-?\d{1,3}(,\d{3})+$/.test(s))) s = s.replace(/,/g,'');
    else s = s.replace(',','.');
  } else if (hasDot){
    if (/^-?\d{1,3}(\.\d{3}){2,}$/.test(s) || (loc==='vi' && /^-?\d{1,3}(\.\d{3})+$/.test(s))) s = s.replace(/\./g,'');
  }
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
const iso = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function pdate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return iso(v.getFullYear(), v.getMonth()+1, v.getDate());
  if (typeof v === 'number' && v > 30000 && v < 80000){ const d = new Date(Math.round((v-25569)*864e5)); return iso(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return iso(+m[1],+m[2],+m[3]);
  if ((m = s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))) return iso(+m[3],+m[2],+m[1]);
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return iso(+m[1],+m[2],+m[3]);
  return null;
}
function addDays(d, n){ const t = new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
function dayDiff(a,b){ return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/864e5); }
function winDates(end, n, first){ const out = []; for (let i = n-1; i >= 0; i--){ const d = addDays(end,-i); if (!first || d >= first) out.push(d); } return out; }
const WD = ['CN','T2','T3','T4','T5','T6','T7'];
const wd = d => WD[new Date(d+'T00:00:00Z').getUTCDay()];
const dm = d => d ? d.slice(8,10)+'/'+d.slice(5,7) : '';
function rangeFromName(name){
  const m = String(name).match(/(20\d{6})[^\d]{0,3}(20\d{6})/);
  if (m) return [pdate(m[1]), pdate(m[2])];
  const one = String(name).match(/(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/);
  return one ? [iso(+one[1],+one[2],+one[3]), iso(+one[1],+one[2],+one[3])] : null;
}
function rangeFromText(rows){
  for (const r of rows.slice(0,15)){
    const line = r.join(' ');
    const n = norm(line);
    if (n.includes('khoang thoi gian') || n.includes('thoi gian') || n.includes('period') || n.includes('date range')){
      const ds = [...line.matchAll(/(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{4}|\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2})/g)].map(x=>pdate(x[1]));
      if (ds.length >= 2) return [ds[0], ds[1]];
      if (ds.length === 1) return [ds[0], ds[0]];
    }
  }
  return null;
}

/* --- Bộ nhận diện cột cho 3 loại file. Mỗi trường: danh sách điều kiện theo thứ tự ưu tiên --- */
const SPECS = {
  prod: {
    id:   { label:'Mã sản phẩm', t:[h=>h==='ma san pham', h=>inc(h,'ma san pham')&&exc(h,'phan loai'), h=>h==='item id'] },
    name: { label:'Tên sản phẩm', t:[h=>h==='san pham', h=>h==='ten san pham', h=>inc(h,'ten san pham')] },
    vid:  { label:'Mã phân loại', t:[h=>inc(h,'ma phan loai'), h=>inc(h,'model id')], opt:1 },
    imp:  { label:'Lượt hiển thị', t:[h=>inc(h,'luot hien thi')&&exc(h,'duy nhat','ty le')] },
    clk:  { label:'Lượt nhấp', t:[h=>inc(h,'luot nhap')&&exc(h,'duy nhat','tim kiem','ty le'), h=>inc(h,'luot click')&&exc(h,'duy nhat','tim kiem','ty le')] },
    pv:   { label:'Lượt xem trang', t:[h=>inc(h,'luot xem trang')] },

function detectHeader(rows, spec){
  let best = -1, bestScore = 0;
  for (let i = 0; i < Math.min(rows.length, 25); i++){
    const hs = rows[i].map(norm);
    let sc = 0;
    for (const k in spec) if (hs.some(h => h && spec[k].t.some(f => f(h)))) sc++;
    if (sc > bestScore){ bestScore = sc; best = i; }
  }
  return { idx: best, score: bestScore };
}
function mapColumns(headers, spec, overrides={}){
  const hs = headers.map(norm), used = new Set(), map = {};
  for (const k in spec){
    const ov = overrides[k];
    if (ov != null){ const j = hs.indexOf(ov); if (j >= 0 && !used.has(j)){ map[k] = j; used.add(j); continue; } }
    for (const f of spec[k].t){
      const j = hs.findIndex((h,ix) => h && !used.has(ix) && f(h));
      if (j >= 0){ map[k] = j; used.add(j); break; }
    }
  }
  return map;
}
function classify(rows){
  // Báo cáo chuyển đổi Affiliate: có cả "mã đơn hàng" lẫn cột hoa hồng / tài khoản tiếp thị liên kết
  for (let i = 0; i < Math.min(rows.length, 25); i++){
    const hs = (rows[i] || []).map(norm);
    if (hs.some(x => inc(x,'ma don hang')) && hs.some(x => inc(x,'tiep thi lien ket') || inc(x,'hoa hong xtra'))) return { type:'aff', idx:i, ratio:1 };
  }
  let best = null;
  for (const type of ['ord','ads','prod']){
    const h = detectHeader(rows, SPECS[type]);
    const req = Object.keys(SPECS[type]).filter(k => !SPECS[type][k].opt).length;
    const need = type === 'ord' ? 3 : 3;
    if (h.score >= need){
      const hs = rows[h.idx].map(norm);
      if (type === 'ord' && !hs.some(x => inc(x,'ma don hang'))) continue;
      if (type === 'ads' && !hs.some(x => x === 'chi phi' || x.startsWith('chi phi'))) continue;
      if (!best || h.score/req > best.ratio) best = { type, idx: h.idx, ratio: h.score/req };
    }
  }
  return best;
}

/* --- Parse 3 loại file --- */
function parseProd(rows, hidx, ov){
  const headers = rows[hidx], map = mapColumns(headers, SPECS.prod, ov);
  const g = (r,k) => map[k] == null ? null : r[map[k]];
  const groups = new Map();
  for (const r of rows.slice(hidx+1)){
    let id = String(g(r,'id') ?? '').trim();
    if (!id || !/\d/.test(id)) continue;
    id = id.replace(/\.0+$/,'');
    const vid = String(g(r,'vid') ?? '').trim();
    const rec = { id, name: String(g(r,'name') ?? '').trim(), parent: !vid || vid === '-' || vid === '--' };
    for (const k of ['imp','clk','pv','vis','atc','ordP','ordC','revP','revC','units','buyers']) rec[k] = num(g(r,k),'vi') ?? 0;
    if (!groups.has(id)) groups.set(id, []);
    groups.get(id).push(rec);
  }
  const out = [];
  for (const [id, list] of groups){
    const parent = list.find(x => x.parent);
    if (parent){ out.push(clean(parent)); continue; }
    const s = { id, name: list[0].name };
    for (const k of ['imp','clk','pv','vis','atc','ordP','ordC','revP','revC','units','buyers']) s[k] = list.reduce((a,x)=>a+x[k],0);
    out.push(clean(s));
  }
  function clean(x){ const o = {...x}; delete o.parent; if (!o.ordP && o.ordC) o.ordP = o.ordC; if (!o.revP && o.revC) o.revP = o.revC; return o; }
  return { rows: out, map, headers };
}
function parseAds(rows, hidx, ov){
  const headers = rows[hidx], map = mapColumns(headers, SPECS.ads, ov);
  const g = (r,k) => map[k] == null ? null : r[map[k]];
  const out = [];
  for (const r of rows.slice(hidx+1)){
    const name = String(g(r,'name') ?? '').trim();
    if (!name) continue;
    const rec = { name, type: String(g(r,'type') ?? '').trim(), status: String(g(r,'status') ?? '').trim(),
      itemId: String(g(r,'itemId') ?? '').trim().replace(/\.0+$/,'').replace(/^-$/,'') };
    for (const k of ['imp','clk','atc','conv','units','rev','cost']) rec[k] = num(g(r,k),'en') ?? 0;
    rec.roasT = num(g(r,'roasT'),'en'); rec.budget = num(g(r,'budget'),'en');
    if (norm(name).startsWith('tong') ) continue;
    out.push(rec);
  }
  return { rows: out, map, headers };
}
function parseOrders(rows, hidx, ov){
  const headers = rows[hidx], map = mapColumns(headers, SPECS.ord, ov);
  const g = (r,k) => map[k] == null ? null : r[map[k]];
  const orders = new Map();
  for (const r of rows.slice(hidx+1)){
    const oid = String(g(r,'oid') ?? '').trim();
    if (!oid) continue;
    let o = orders.get(oid);
    if (!o){
      o = { i: oid, d: pdate(g(r,'date')), st: String(g(r,'status') ?? '').trim(), g: 0, sr: 0, er: 0, sv: 0, ev: 0, cs: 0, ce: 0, x: 0, cd: 0, it: [] };
      orders.set(oid, o);
    }
    const qty = num(g(r,'qty'),'vi') ?? 1;
    const line = num(g(r,'line'),'vi') ?? ((num(g(r,'deal'),'vi') ?? 0) * qty);
    o.g += line;
    o.sr += num(g(r,'sellerReb'),'vi') ?? 0;
    o.er += num(g(r,'shopeeReb'),'vi') ?? 0;
    o.sv = Math.max(o.sv, num(g(r,'shopV'),'vi') ?? 0);
    o.ev = Math.max(o.ev, num(g(r,'shopeeV'),'vi') ?? 0);
    o.cs = Math.max(o.cs, num(g(r,'comboShop'),'vi') ?? 0);
    o.ce = Math.max(o.ce, num(g(r,'comboShopee'),'vi') ?? 0);
    o.x  = Math.max(o.x,  num(g(r,'coins'),'vi') ?? 0);
    o.cd = Math.max(o.cd, num(g(r,'card'),'vi') ?? 0);
    const nm = String(g(r,'name') ?? '').trim();
    if (nm) o.it.push({ n: nm.slice(0,90), q: qty });
  }
  const byDay = new Map();
  for (const o of orders.values()){
    if (!o.d) continue;
    if (!byDay.has(o.d)) byDay.set(o.d, []);
    byDay.get(o.d).push(o);
  }
  return { byDay, map, headers, count: orders.size };
}
const isCancel = st => { const n = norm(st); return n.includes('huy') || n.includes('cancel'); };
function parseAff(rows, hidx, ov){
  const headers = rows[hidx], map = mapColumns(headers, SPECS.aff, ov);
  const g = (r,k) => map[k] == null ? null : r[map[k]];
  const byDay = new Map(); let n = 0; const ids = new Set();
  for (const r of rows.slice(hidx+1)){
    const o = String(g(r,'oid') ?? '').trim(); if (!o) continue;
    const d = pdate(g(r,'date')); if (!d) continue;
    const st = String(g(r,'status') ?? '').trim(), fr = norm(g(r,'fraud') ?? '');
    const id = String(g(r,'id') ?? '').trim().replace(/\.0+$/,'');
    const x = isCancel(st) || (fr && fr.includes('khong')) ? 1 : 0;
    const rec = { o, id, n: String(g(r,'name') ?? '').slice(0,80), q: num(g(r,'qty'),'en') ?? 1, gmv: num(g(r,'gmv'),'en') ?? 0, cost: num(g(r,'cost'),'en') ?? 0,
      com: num(g(r,'com'),'en') ?? 0, d: norm(g(r,'type') ?? '').includes('truc tiep') ? 1 : 0, ch: String(g(r,'ch') ?? '').trim(), pt: String(g(r,'partner') ?? '').trim(),
      acc: String(g(r,'acc') ?? '').trim(), st, x };
    if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(rec); n++; if (id) ids.add(id);
  }
  return { byDay, map, headers, count: n, ids: [...ids] };
}

const sb = (window.supabase && CONFIG.SUPABASE_URL.startsWith('https://') && !CONFIG.SUPABASE_URL.includes('xxxx'))

const DAILY = ['prod','ads','ord','aff'];
const Cache = {
  db: null,
  open(){ return new Promise(res => { try{ const r = indexedDB.open('svs-cache', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => res(); }catch(e){ res(); } }); },
  get(k){ return new Promise(res => { if (!this.db) return res(null); const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); },
  set(k,v){ return new Promise(res => { if (!this.db) return res(); const t = this.db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete = res; t.onerror = res; }); },
  del(k){ return new Promise(res => { if (!this.db) return res(); const t = this.db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); },
};
const chk = ({ data, error }) => { if (error) throw new Error(error.message || String(error)); return data; };
const Store = {
  mode: 'cloud', idb: true, mem: {},
  async init(){ await Cache.open(); },
  /* đồng bộ sv_daily của 1 shop: lấy các dòng có updated_at mới hơn lần trước */
  async daily(shop, force){
    if (this.mem[shop] && !force) return this.mem[shop];
    let c = force ? null : await Cache.get('daily:' + shop);
    if (!c) c = { rows: {}, last: null };
    for (let from = 0; ; from += 500){
      let q = sb.from('sv_daily').select('kind,date,rows,updated_at').eq('shop', shop).order('updated_at', { ascending: true });
      if (c.last) q = q.gt('updated_at', c.last);
      const data = chk(await q.range(from, from + 499));
      for (const r of data){ c.rows[r.kind + '|' + r.date] = { rows: r.rows, u: r.updated_at }; }
      if (data.length) c.last = data[data.length-1].updated_at > (c.last || '') ? data[data.length-1].updated_at : c.last;
      if (data.length < 500) break;
    }
    this.mem[shop] = c; await Cache.set('daily:' + shop, c);
    return c;
  },
  async list(kind, shop){
    if (DAILY.includes(kind)){
      const shops = shop ? [shop] : S.cfg.shops.map(s => s.id), out = [];
      for (const sh of shops){
        const c = await this.daily(sh);
        for (const [k,v] of Object.entries(c.rows)){
          const [kd, d] = k.split('|'); if (kd !== kind) continue;
          out.push({ _id: safeId(sh + '__' + d), shop: sh, date: d, ...(kind === 'ord' ? { orders: v.rows } : { rows: v.rows }) });
        }
      }
      return out;
    }
    if (kind === 'chg'){
      let q = sb.from('sv_changes').select('*'); if (shop) q = q.eq('shop', shop);
      return chk(await q.limit(5000)).map(r => ({ _id: r.id, ...r }));
    }
    return [];
  },
  async get(kind){
    if (kind !== 'cfg') return null;
    const shops = chk(await sb.from('sv_shops').select('id,name,shopee_shop_id,fees').order('created_at'));
    const st = chk(await sb.from('sv_settings').select('value').eq('key','cfg').maybeSingle());
    let cur = null; try { cur = localStorage.getItem('svs-shop'); } catch(e){}
    return { shops: shops.length ? shops : S.cfg.shops, shop: shops.some(s => s.id === cur) ? cur : (shops[0]?.id || S.cfg.shop), ov: st?.value?.ov || {}, rov: st?.value?.rov || {}, evAuto: st?.value?.evAuto !== false, revType: st?.value?.revType || 'placed', cols: st?.value?.cols || {} };
  },
  async put(kind, id, obj){
    if (DAILY.includes(kind)){
      const rows = obj.rows ?? obj.orders;
      const d = chk(await sb.from('sv_daily').upsert({ shop: obj.shop, kind, date: obj.date, rows, source: obj.file || null }, { onConflict: 'shop,kind,date' }).select('updated_at').single());
      const c = await this.daily(obj.shop); c.rows[kind + '|' + obj.date] = { rows, u: d.updated_at }; await Cache.set('daily:' + obj.shop, c);
      return;
    }
    if (kind === 'chg'){ chk(await sb.from('sv_changes').upsert({ id, shop: obj.shop, date: obj.date, pid: obj.pid, type: obj.type, win: obj.win, note: obj.note })); return; }
    if (kind === 'cfg'){
      chk(await sb.from('sv_shops').upsert(obj.shops.map(s => ({ id: s.id, name: s.name, shopee_shop_id: s.shopee_shop_id || null, fees: s.fees || {} }))));
      chk(await sb.from('sv_settings').upsert({ key: 'cfg', value: { ov: obj.ov || {}, rov: obj.rov || {}, evAuto: obj.evAuto !== false, revType: obj.revType || 'placed', cols: obj.cols || {} } }));
      try { localStorage.setItem('svs-shop', obj.shop); } catch(e){}
    }
  },
  async del(kind, id){
    if (DAILY.includes(kind)){
      const [shop, date] = id.split('__');
      chk(await sb.from('sv_daily').delete().eq('shop', shop).eq('kind', kind).eq('date', date));
      const c = await this.daily(shop); delete c.rows[kind + '|' + date]; await Cache.set('daily:' + shop, c);
      return;
    }
    if (kind === 'chg') chk(await sb.from('sv_changes').delete().eq('id', id));
  },
};

const nf = new Intl.NumberFormat('vi-VN');
function fmt(v, f){
  if (v == null || !isFinite(v)) return '—';
  if (f === 'int') return nf.format(Math.round(v));
  if (f === 'pct') return (v*100).toFixed(2).replace('.',',') + '%';
  if (f === 'x') return v.toFixed(2).replace('.',',');
  if (f === 'money'){
    const a = Math.abs(v);

function chart({ dates, series, markers = [], h = 110, axis = false, labels = null, w = 860 }){
  const W = w, compact = w < 500, pl = compact ? 40 : 58, pr = compact ? 8 : 52, pt = 10, pb = axis ? 22 : 6, H = h;
  const n = dates.length; if (!n) return '';
  const bw = (W - pl - pr) / n, cx = i => pl + bw*(i+.5);
  const ih = H - pt - pb;
  let out = `<svg class="c" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.l).join(', '))}">`;
  for (let g = 0; g <= 2; g++){ const y = pt + ih*g/2; out += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/>`; }
  series.forEach((s, si) => {
    const vals = s.vals.map(v => v == null || !isFinite(v) ? null : v);
    const has = vals.some(v => v != null && v !== 0);
    const mx = Math.max(0, ...vals.filter(v => v != null)) || 1;
    const y = v => pt + ih - (v/mx)*ih;
    const side = si === 0 ? pl - 6 : W - pr + 6, anchor = si === 0 ? 'end' : 'start';
    out += `<text x="${side}" y="${pt+9}" text-anchor="${anchor}" style="fill:${s.c}">${has ? esc(fmt(mx, s.f)) : '—'}</text>`;
    if (s.bar){
      vals.forEach((v,i) => { if (v == null) return; const hh = (v/mx)*ih; out += `<rect x="${cx(i)-bw*.32}" y="${pt+ih-hh}" width="${bw*.64}" height="${Math.max(hh,.5)}" rx="1.5" fill="${s.c}" opacity=".78"/>`; });
    } else {
      let d = '', pen = false;
      vals.forEach((v,i) => { if (v == null){ pen = false; return; } d += (pen ? 'L' : 'M') + cx(i).toFixed(1) + ' ' + y(v).toFixed(1); pen = true; });
      out += `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
      if (n <= 45) vals.forEach((v,i) => { if (v != null) out += `<circle cx="${cx(i)}" cy="${y(v)}" r="2.4" fill="${s.c}"/>`; });
    }
  });
  markers.forEach(mk => {
    const i = dates.indexOf(mk.date); if (i < 0) return;
    const x = cx(i) - bw/2;
    out += `<line class="mk ${mk.ev ? 'ev' : ''}" x1="${x}" x2="${x}" y1="${pt}" y2="${pt+ih}"/>`;
    if (mk.label) out += `<text class="mkl" x="${x+3}" y="${pt+ih-3}">${esc(mk.label)}</text>`;
  });
  if (axis){
    const step = Math.ceil(n / Math.max(4, Math.floor(W / 72)));
    dates.forEach((d,i) => { if (i % step === 0 || i === n-1) out += `<text x="${cx(i)}" y="${H-6}" text-anchor="middle">${esc(labels ? labels[i] : dm(d))}</text>`; });
  }
  dates.forEach((d,i) => {
    const tip = (labels ? labels[i] : `${wd(d)} ${dm(d)}`) + '\n' + series.map(s => `${s.l}: ${fmt(s.vals[i], s.f)}`).join('\n');
    out += `<rect class="hit" x="${cx(i)-bw/2}" y="${pt}" width="${bw}" height="${ih}"><title>${esc(tip)}</title></rect>`;
  });
  return out + '</svg>';
}
function chartBlock(title, series, dates, markers, axis, labels){
  return `<div class="ch"><div class="ch-t">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.l)}</span>`).join('')}${title ? `<span class="muted">${esc(title)}</span>` : ''}</div>${chart({ dates, series, markers, axis, labels })}</div>`;

function phi(x){ const t = 1/(1+.2316419*Math.abs(x)); const d = .3989423*Math.exp(-x*x/2); const p = d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return x > 0 ? 1-p : p; }
function ztest(x1,n1,x2,n2){
  if (n1 < 1 || n2 < 1) return null;
  const p1 = x1/n1, p2 = x2/n2, p = (x1+x2)/(n1+n2), se = Math.sqrt(p*(1-p)*(1/n1+1/n2));
  if (!se) return { p1, p2, pv: 1 };
  const z = (p2-p1)/se; return { p1, p2, z, pv: 2*(1-phi(Math.abs(z))) };
}
const CHG_TYPES = {
  anh:   { l:'Ảnh / video bìa', win:5, focus:['ctr','imp'] },

function evalChange(c){
  const fn = c.pid === '*' ? shopDay : d => entDay(d, c.pid);
  const W = +c.win || CHG_TYPES[c.type]?.win || 7;
  const beforeD = [], afterD = [];
  let skipped = 0;
  for (let i = 1; beforeD.length < W && i <= W*3; i++){ const d = addDays(c.date,-i); if (isEvent(d)) skipped++; else beforeD.push(d); }
  for (let i = 1; afterD.length < W && i <= W*3; i++){ const d = addDays(c.date,i); if (isEvent(d)) skipped++; else afterD.push(d); }
  const sum = ds => { const xs = ds.map(fn).filter(Boolean); const s = { n: xs.length };
    for (const k of ['imp','clk','atc','ord','rev','cost','adRev']) s[k] = xs.reduce((a,x)=>a+(x[k]||0),0); return s; };
  const b = sum(beforeD), a = sum(afterD);
  const res = { W, b, a, rows: [], skipped };
  const rateRow = (k, num, den) => {
    const t = ztest(b[num], b[den], a[num], a[den]);
    return { k, before: b[den] ? b[num]/b[den] : null, after: a[den] ? a[num]/a[den] : null, t, enough: (b[num]+a[num]) >= 12 && b[den] >= 50 && a[den] >= 50 };
  };
  const avgRow = (k) => ({ k, before: b.n ? b[k]/b.n : null, after: a.n ? a[k]/a.n : null });
  for (const k of CHG_TYPES[c.type]?.focus || ['ctr','cr']){
    if (k === 'ctr') res.rows.push(rateRow('ctr','clk','imp'));
    else if (k === 'atcR') res.rows.push(rateRow('atcR','atc','clk'));
    else if (k === 'cr') res.rows.push(rateRow('cr','ord','clk'));
    else if (k === 'roas') res.rows.push({ k, before: b.cost ? b.adRev/b.cost : null, after: a.cost ? a.adRev/a.cost : null });
    else res.rows.push(avgRow(k));
  }
  const main = res.rows[0];
  if (a.n < W) res.verdict = { cls:'wait', t:`Đang chờ dữ liệu (${a.n}/${W} ngày sau)` };
  else if (b.n < Math.ceil(W/2)) res.verdict = { cls:'wait', t:'Thiếu dữ liệu trước thay đổi' };
  else if (main.t){
    if (!main.enough) res.verdict = { cls:'wait', t:'Số liệu còn quá ít để kết luận' };
    else if (main.t.pv < .05) res.verdict = main.after > main.before ? { cls:'up', t:`${M[main.k].l} tăng có ý nghĩa` } : { cls:'down', t:`${M[main.k].l} giảm có ý nghĩa` };
    else res.verdict = { cls:'wait', t:'Chưa thấy khác biệt rõ' };
  } else {
    const dv = delta(main.after, main.before);
    res.verdict = dv == null ? { cls:'wait', t:'Chưa đủ dữ liệu' } : Math.abs(dv) < .1 ? { cls:'wait', t:'Gần như không đổi' } : dv > 0 ? { cls:'up', t:`${M[main.k].l} +${Math.round(dv*100)}%` } : { cls:'down', t:`${M[main.k].l} −${Math.round(-dv*100)}%` };
  }
  res.overlap = S.chg.filter(o => o !== c && (o.pid === c.pid || o.pid === '*' || c.pid === '*' || entIds(c.pid).includes(o.pid) || entIds(o.pid).includes(c.pid)) && Math.abs(dayDiff(o.date, c.date)) <= W);
  return res;
}

/* auto: phát hiện đổi mục tiêu ROAS / ngân sách từ file quảng cáo */

  for (let g = 0; g <= 4; g++){ const v = mx * g / 4, yy = y(v); o += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${esc(fmt(v, f))}</text>`; }
  if (bars) bars.vals.forEach((v,i) => { if (v == null) return; const hh = (v / mx) * ih; o += `<rect x="${cx(i)-bw*.33}" y="${pt+ih-hh}" width="${bw*.66}" height="${Math.max(hh,.5)}" rx="2" fill="${bars.c}" opacity=".35"/>`; });

/* =====================================================================
   KỲ BÁO CÁO: ngày / tuần (T2→CN) / tháng — tổng hợp từ số theo ngày

const GRAN_L = { day:'Ngày', week:'Tuần', month:'Tháng' };
const wdIdx = d => new Date(d+'T00:00:00Z').getUTCDay();
function isoWeek(d){ const t = new Date(d+'T00:00:00Z'); const day = (t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3); const fy = new Date(Date.UTC(t.getUTCFullYear(),0,4)); return 1 + Math.round(((t - fy)/864e5 - 3 + ((fy.getUTCDay()+6)%7))/7); }

  if (g === 'week'){ const s = addDays(d, -((wdIdx(d)+6)%7)), e = addDays(s, 6); return { g, start:s, end:e, key:s, label:`Tuần ${isoWeek(s)}`, short:`T${isoWeek(s)}`, sub:`${dm(s)}–${dm(e)}` }; }

    return { g, start:s, end:e, key:s, label:`Tháng ${+d.slice(5,7)}/${d.slice(0,4)}`, short:`Th${+d.slice(5,7)}`, sub:`${dm(s)}–${dm(e)}` }; }
  return { g:'day', start:d, end:d, key:d, label:`${wd(d)} ${dm(d)}`, short:dm(d), sub:'' };

/* kỳ trước "cùng độ dài": tháng này đến ngày 15 so với 15 ngày đầu tháng trước */

  const s = { n: xs.length, days: dates.length };

  s.ctr = s.imp ? s.clk/s.imp : null; s.atcR = s.clk ? s.atc/s.clk : null; s.cr = s.clk ? s.ord/s.clk : null;
  s.roas = s.cost ? s.adRev/s.cost : null; s.acos = s.adRev ? s.cost/s.adRev : null; s.adShare = s.rev ? Math.min(1, s.adRev/s.rev) : null;
  return s;
}
function entProfitSum(key, dates){ let t = 0, any = false; for (const d of dates){ const l = entProfitDay(d, key); if (l != null){ t += l; any = true; } } return any ? t : null; }

  const unlinked = dates.reduce((a,d) => a + (S.ads.get(d) || []).filter(r => !r.itemId || !productIndex().has(r.itemId)).reduce((x,r) => x + r.cost, 0), 0);

/* "Ngữ cảnh so sánh" dùng chung cho mọi màn hình */
function cmpContext(D){

    const base = S.cmp === 'd1' ? [addDays(D,-1)] : S.cmp === 'd7' ? [addDays(D,-7)] : sameTypeDays(D, 7);

/* =====================================================================

const KPI_DEF = [
  ['rev','Doanh số','money'], ['ord','Đơn hàng','int'], ['imp','Hiển thị','int'], ['ctr','CTR','pct'],
  ['cr','Chuyển đổi (đơn/nhấp)','pct'], ['cost','Chi quảng cáo','money'], ['lng','Lợi nhuận góp','money'], ['affRev','Doanh số affiliate','money'],
];
const RATE_KEYS = ['ctr','cr','atcR','roas','acos','adShare'];
/* chuỗi luỹ kế theo ngày trong một kỳ: số đếm cộng dồn, tỷ lệ tính trên tổng luỹ kế */
function cumSeries(dates, cap, k){
  const acc = {}, out = []; let l = 0, any = false;
  for (const d of dates){
    if (cap && d > cap){ out.push(null); continue; }
    const x = shopDay(d);
    if (k === 'lng'){ const v = shopProfit([d]).lng; if (v != null){ l += v; any = true; } out.push(any ? l : null); continue; }
    if (x){ any = true; for (const f of ADD_KEYS) acc[f] = (acc[f] || 0) + (x[f] || 0); }
    if (!any){ out.push(null); continue; }
    const r = { ...acc, ctr: acc.imp ? acc.clk/acc.imp : null, cr: acc.clk ? acc.ord/acc.clk : null, atcR: acc.clk ? acc.atc/acc.clk : null, roas: acc.cost ? acc.adRev/acc.cost : null,
      acos: acc.adRev ? acc.cost/acc.adRev : null, adShare: acc.rev ? Math.min(1, acc.adRev/acc.rev) : null };
    out.push(r[k] ?? null);
  }
  return out;
}
function trendBlock(D, k){

  const val = d => k === 'lng' ? shopProfit([d]).lng : shopDay(d)?.[k] ?? null;
  if (S.gran === 'day'){
    const ds = spanDates(addDays(D, -27), D);
    const bars = ds.map(val);
    const roll = ds.map((d, i) => { const w = ds.slice(Math.max(0, i - 6), i + 1);
      if (k === 'lng'){ const xs = w.map(val).filter(v => v != null); return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; }
      const s = sumOver(shopDay, w); if (!s) return null; return RATE_KEYS.includes(k) ? s[k] : s[k] / s.n; });
    return { title: `${name} theo ngày, 28 ngày gần nhất`, legend: [['var(--s1)', 'Từng ngày', 'bar'], ['var(--s4)', 'Trung bình 7 ngày', 'line']],
      svg: cmpChart({ labels: ds.map(d => `${wd(d)} ${dm(d)}`), bars: { l:'Từng ngày', vals: bars, c: css('--s1') }, series: [{ l:'TB 7 ngày', vals: roll, c: css('--s4') }], f }) };
  }

  const cur = cumSeries(pd.filter(Boolean), D, k), prev = cumSeries(qd.filter(Boolean), null, k);

  return { title: `${name} luỹ kế: ${P.label} so với ${Q.label.toLowerCase()}`, legend: [[css('--pri'), P.label, 'line'], [css('--ink3'), Q.label, 'dash']],

}
function viewDay(){

const ADS_METRICS = {
  cost:{ l:'Chi phí', f:'money', get:r => r.cost },
  roas:{ l:'ROAS', f:'x', get:r => r.cost ? r.rev/r.cost : null },
  rev: { l:'Doanh số', f:'money', get:r => r.rev },
  conv:{ l:'Chuyển đổi', f:'int', get:r => r.conv || r.units },
  clk: { l:'Click', f:'int', get:r => r.clk },
  imp: { l:'Hiển thị', f:'int', get:r => r.imp },
  cpc: { l:'CPC', f:'vnd', inv:1, get:r => r.clk ? r.cost/r.clk : null },
  ctr: { l:'CTR', f:'pct', get:r => r.imp ? r.clk/r.imp : null },
};
function viewAds(){
  if (!S.ads.size) return emptyState('ads');
  const end = S.date && S.ads.has(S.date) ? S.date : [...S.ads.keys()].sort().at(-1), G = S.gran;
  /* A = số quảng cáo theo cột: từng ngày, hoặc cộng dồn theo tuần/tháng */
  let dates, labels = null, A = S.ads, prevKey = d => addDays(d, -1), colDays = d => [d];
  if (G === 'day') dates = winDates(end, S.adsRange, [...S.ads.keys()].sort()[0]);
  else {
    const ps = lastPeriods(G, end, G === 'week' ? 8 : 6); dates = ps.map(p => p.key); labels = ps.map(p => p.short);
    const pm = new Map(ps.map(p => [p.key, p])); A = new Map();
    for (const p of ps){ const agg = new Map(); let any = false;
      for (const d of periodDates(p, end)) for (const r of (S.ads.get(d) || [])){ any = true; const o = agg.get(r.name) || { ...r, cost:0, rev:0, clk:0, imp:0, conv:0, units:0, atc:0 };
        for (const k of ['cost','rev','clk','imp','conv','units','atc']) o[k] += r[k] || 0; o.roasT = r.roasT ?? o.roasT; o.budget = r.budget ?? o.budget; agg.set(r.name, o); }
      if (any) A.set(p.key, [...agg.values()]); }
    while (dates.length > 1 && !A.has(dates[0])){ dates.shift(); labels.shift(); }
    prevKey = k => { const i = dates.indexOf(k); return i > 0 ? dates[i-1] : null; };
    colDays = k => periodDates(pm.get(k), end);
  }
  const camps = new Map();
  for (const d of dates) for (const r of (A.get(d) || [])){
    if (!camps.has(r.name)) camps.set(r.name, { name:r.name, type:r.type, itemId:r.itemId, days:{} });
    camps.get(r.name).days[d] = r;
  }
  const am = ADS_METRICS[S.adsMetric];
  const sumR = rs => rs.reduce((a,r) => ({ cost:a.cost+r.cost, rev:a.rev+r.rev, clk:a.clk+r.clk, imp:a.imp+r.imp, conv:a.conv+(r.conv||r.units||0), units:0 }), { cost:0, rev:0, clk:0, imp:0, conv:0 });
  const list = [...camps.values()].map(c => ({ ...c, tot: sumR(Object.values(c.days)) })).sort((a,b) => b.tot.cost - a.tot.cost);
  const dayTot = dates.map(d => A.has(d) ? sumR(A.get(d)) : null);
  const rmax = Math.max(1e-9, ...list.flatMap(c => dates.map(d => c.days[d] ? (am.get(c.days[d]) ?? 0) : 0)));
  const beOf = c => beRoas(c.itemId && productIndex().has(c.itemId) ? c.itemId : null, end);
  const shade = (val, be) => {
    if (val == null) return '';
    if (S.adsMetric === 'roas'){ if (!be) return ''; const ok = val >= be*1.2 ? 'var(--up-soft)' : val >= be ? 'var(--muted-soft)' : 'var(--down-soft)'; return `background:${ok}`; }
    const a = Math.min(1, val / rmax); return `background:color-mix(in srgb,var(--s1) ${Math.round(a*38)}%,transparent)`;
  };
  if (!S.adsSel || !camps.has(S.adsSel)) S.adsSel = list[0]?.name;
  const sel = camps.get(S.adsSel);
  const c1 = css('--s1'), c2 = css('--s2'), c4 = css('--s4');
  const totChart = chartBlock('Toàn bộ quảng cáo', [{ l:'Chi phí', vals: dayTot.map(t => t?.cost ?? null), c:c4, f:'money', bar:1 }, { l:'ROAS', vals: dayTot.map(t => t && t.cost ? t.rev/t.cost : null), c:c2, f:'x' }], dates, S.chg.filter(c => ['roas','budget','ads_on'].includes(c.type)).map(c => ({ date: G === 'day' ? c.date : periodOf(c.date, G).key })).filter(m => dates.includes(m.date)), true, labels);
  const detail = sel ? dates.slice().reverse().map(d => ({ d, r: sel.days[d], p: sel.days[prevKey(d)] })) : [];
  const dcols = ['cost','imp','clk','ctr','cpc','conv','rev','roas'];
  return `
  <section class="sec">
    <div class="sec-h"><h2>Chi phí và ROAS theo ${GRAN_L[G].toLowerCase()}</h2><div class="right">${G === 'day' ? `<div class="seg" role="group" aria-label="Khoảng ngày">${[7,14,30].map(n => `<button data-arange="${n}" aria-pressed="${S.adsRange===n}">${n} ngày</button>`).join('')}</div>` : `<span class="hint">${G === 'week' ? '8 tuần' : '6 tháng'} gần nhất, cộng từ số theo ngày</span>`}</div></div>
    <div class="sec-b">${totChart}</div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Chiến dịch × ${GRAN_L[G].toLowerCase()}</h2><span class="hint">Ô trống = không chạy hoặc chưa có số. ROAS đỏ = thấp hơn ROAS hoà vốn của sản phẩm</span>
      <div class="right"><div class="seg" role="group" aria-label="Chỉ số">${Object.entries(ADS_METRICS).map(([k,m]) => `<button data-am="${k}" aria-pressed="${S.adsMetric===k}">${m.l}</button>`).join('')}</div></div></div>
    <div class="tw"><table class="mx"><thead><tr><th>Chiến dịch</th><th>Tổng kỳ</th><th title="ROAS hoà vốn từ giá vốn + phí sàn, 30 ngày">ROAS HV</th>${dates.map((d,i) => `<th>${labels ? `${labels[i]}<br>${dm(d)}` : `${wd(d)}<br>${dm(d)}`}</th>`).join('')}</tr></thead><tbody>
      <tr class="total"><td>Tất cả</td><td>${fmt(am.get(sumR(dayTot.filter(Boolean))), am.f)}</td><td>${fmt(beRoas(null, end),'x')}</td>${dayTot.map(t => `<td class="cell">${t ? fmt(am.get(t), am.f) : '—'}</td>`).join('')}</tr>
      ${list.map(c => `<tr class="click" data-camp="${esc(c.name)}"><td><span class="pcell">${c.itemId ? thumb(c.itemId, 30) : ''}<span><span class="pname" title="${esc(c.name)}">${esc(c.itemId && productIndex().has(c.itemId) ? dispName(c.itemId) : c.name)}</span><span class="pid">${esc(c.type)}${c.itemId ? ' · '+esc(c.itemId) : ''}${c.itemId && skuOf(c.itemId).grp ? ' · ' + esc(skuOf(c.itemId).grp) : ''}</span></span></span></td>
        <td><b>${fmt(am.get(c.tot), am.f)}</b></td><td>${(() => { const be = beOf(c); return be ? `<span class="${c.tot.cost && c.tot.rev/c.tot.cost < be ? 'neg' : ''}">${fmt(be,'x')}</span>` : '<span class="muted" title="Chưa có giá vốn">—</span>'; })()}</td>
        ${dates.map(d => { const r = c.days[d]; const val = r ? am.get(r) : null; const be = beOf(c); return `<td class="cell" style="${shade(val, be)}" title="${r ? esc(`${dm(d)} · chi ${fmt(r.cost,'vnd')} · DS ${fmt(r.rev,'vnd')} · ROAS ${fmt(r.cost?r.rev/r.cost:null,'x')}`) : ''}">${r ? fmt(val, am.f) : ''}${r && S.adsMetric==='cost' ? `<span class="${be && r.cost && r.rev/r.cost < be ? 'neg' : ''}">${r.cost ? 'R ' + fmt(r.rev/r.cost,'x') : ''}</span>` : ''}</td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>
  </section>
  ${sel ? `<section class="sec">
    <div class="sec-h"><h2>Chi tiết theo ${GRAN_L[G].toLowerCase()}</h2><span class="hint">${esc(sel.name.slice(0,100))}</span></div>
    <div class="tw"><table><thead><tr><th>${GRAN_L[G]}</th>${dcols.map(k => `<th>${ADS_METRICS[k].l}</th>`).join('')}<th>Mục tiêu ROAS</th><th>Ngân sách</th></tr></thead><tbody>
      ${detail.map(({d,r,p}) => `<tr class="${S.chg.some(c => colDays(d).includes(c.date) && (c.pid===sel.itemId || c.pid==='*')) ? 'chg' : ''}"><td>${labels ? `<b>${labels[dates.indexOf(d)]}</b><span class="wk">${dm(d)}</span>` : `${dm(d)}<span class="wk">${wd(d)}</span>`}</td>${dcols.map(k => { const m = ADS_METRICS[k]; return `<td>${r ? `<span class="v">${fmt(m.get(r), m.f)}</span>${p ? dchip(m.get(r), m.get(p), k==='cost' ? {neutral:1} : m, 'dd') : ''}` : '<span class="muted">—</span>'}</td>`; }).join('')}<td>${r?.roasT ?? '—'}</td><td>${r?.budget != null ? fmt(r.budget,'money') : '—'}</td></tr>`).join('')}
    </tbody></table></div>
  </section>` : ''}`;
}

function vcDay(d){
  const os = S.ord.get(d); if (!os || !os.length) return null;
  const ok = os.filter(o => !isCancel(o.st));
  const r = { n: ok.length, cancel: os.length - ok.length, gmv:0, eFund:0, sFund:0, ev:0, evN:0, sv:0, svN:0, x:0 };
  for (const o of ok){
    r.gmv += o.g; r.eFund += o.ev + o.er + o.ce + o.x; r.sFund += o.sv + o.sr + o.cs;
    r.ev += o.ev; if (o.ev > 0) r.evN++; r.sv += o.sv; if (o.sv > 0) r.svN++; r.x += o.x;
  }
  r.eRate = r.gmv ? r.eFund/r.gmv : null; r.sRate = r.gmv ? r.sFund/r.gmv : null;
  r.evPct = r.n ? r.evN/r.n : null; r.evAvg = r.evN ? r.ev/r.evN : null; r.cancelRate = os.length ? r.cancel/os.length : null;
  return r;
}
function viewVc(){
  if (!S.ord.size) return emptyState('ord');
  const end = S.date && S.ord.has(S.date) ? S.date : [...S.ord.keys()].sort().at(-1);
  const dates = winDates(end, S.vcRange, [...S.ord.keys()].sort()[0]);
  const vs = dates.map(vcDay);
  const sig = (v, i) => {
    if (!v || v.n < 3) return '<span class="muted">—</span>';
    const prev = vs.slice(Math.max(0,i-14), i).filter(Boolean).map(x => x.eRate);
    const med = median(prev); if (med == null || prev.length < 3) return '<span class="muted">chưa đủ mốc</span>';
    if (v.eRate > med*1.3) return '<span class="chip flag">Sàn đẩy mạnh</span>';
    if (v.eRate < med*.7) return '<span class="chip wait">Sàn trợ thấp</span>';
    return '<span class="muted">Bình thường</span>';
  };
  const c1 = css('--s1'), c2 = css('--s2'), c3 = css('--s3'), c4 = css('--s4');
  const adsCost = dates.map(d => S.ads.has(d) ? S.ads.get(d).reduce((a,r)=>a+r.cost,0) : null);
  return `
  <section class="sec">
    <div class="sec-h"><h2>Mức trợ giá của Shopee theo ngày</h2><span class="hint">Tính trên đơn không huỷ: (voucher Shopee + Shopee trợ giá + combo Shopee + Xu) ÷ GMV</span>
      <div class="right"><div class="seg" role="group" aria-label="Khoảng ngày">${[14,30,60].map(n => `<button data-vrange="${n}" aria-pressed="${S.vcRange===n}">${n} ngày</button>`).join('')}</div></div></div>
    <div class="sec-b"><div class="charts">
      ${chartBlock('', [{ l:'% GMV Shopee trợ', vals: vs.map(v => v?.eRate ?? null), c:c3, f:'pct', bar:1 }, { l:'% đơn có voucher Shopee', vals: vs.map(v => v?.evPct ?? null), c:c2, f:'pct' }], dates, [])}
      ${chartBlock('', [{ l:'Đơn (không huỷ)', vals: vs.map(v => v?.n ?? null), c:c1, f:'int', bar:1 }, { l:'Chi ads', vals: adsCost, c:c4, f:'money' }], dates, [], true)}
    </div></div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Sổ voucher theo ngày</h2><span class="hint">“Sàn đẩy mạnh” khi mức trợ vượt 30% so với trung vị 14 ngày trước</span></div>
    <div class="tw"><table><thead><tr><th>Ngày</th><th>Đơn</th><th>Huỷ</th><th>GMV</th><th>Shopee trợ</th><th>% GMV</th><th>% đơn có voucher sàn</th><th>Voucher sàn TB/đơn</th><th>Xu</th><th>Shop tự trợ</th><th>% GMV</th><th>Chi ads</th><th class="l">Tín hiệu</th></tr></thead><tbody>
      ${dates.map((d,i) => ({d,i,v:vs[i]})).reverse().map(({d,i,v}) => `<tr><td>${dm(d)}<span class="wk">${wd(d)}</span></td>${v ? `<td>${v.n}</td><td>${v.cancel}</td><td>${fmt(v.gmv,'money')}</td><td>${fmt(v.eFund,'money')}</td><td><b>${fmt(v.eRate,'pct')}</b></td><td>${fmt(v.evPct,'pct')}</td><td>${fmt(v.evAvg,'vnd')}</td><td>${fmt(v.x,'money')}</td><td>${fmt(v.sFund,'money')}</td><td>${fmt(v.sRate,'pct')}</td>` : '<td colspan="10" class="muted" style="text-align:center">chưa có đơn</td>'}<td>${adsCost[i] != null ? fmt(adsCost[i],'money') : '—'}</td><td class="l">${sig(v,i)}</td></tr>`).join('')}

/* ---------- Lịch sự kiện sàn ---------- */
function eventOn(d){
  const custom = S.events.find(e => e.date === d && (!e.shop || e.shop === S.cfg.shop));
  if (custom) return { name: custom.name, kind: custom.kind || 'custom' };
  if (S.cfg.evAuto === false) return null;
  const m = +d.slice(5,7), dd = +d.slice(8,10);
  if (m === dd) return { name: `${m}.${m}`, kind: m >= 9 ? 'mega' : 'double' };
  if (dd === 15) return { name: 'Sale 15', kind: 'mid' };
  if (dd === 25) return { name: 'Sale lương', kind: 'payday' };
  return null;
}
const isEvent = d => !!eventOn(d);
/* n ngày gần nhất trước D có cùng "loại ngày" với D (thường ↔ thường, sale ↔ sale), tìm lùi tối đa 60 ngày */
function sameTypeDays(D, n, maxBack = 60){
  const ev = isEvent(D), out = [];
  for (let i = 1; i <= maxBack && out.length < n; i++){ const d = addDays(D,-i); if (isEvent(d) === ev) out.push(d); }
  return out;
}
const evTag = d => { const e = eventOn(d); return e ? `<span class="evt ${e.kind}" title="Ngày sale">${esc(e.name)}</span>` : ''; };

/* ---------- Danh mục SKU + phí sàn ---------- */
const ROLES = { hero:'Chủ lực', grow:'Tăng trưởng', tail:'Đuôi', new:'Mới' };
const FEE_FIELDS = [
  ['fixed','Phí cố định (%)','Theo ngành hàng của sản phẩm'],
  ['pay','Phí thanh toán (%)',''],
  ['service','Phí gói dịch vụ (%)','Freeship Xtra, Voucher Xtra… cộng lại'],
  ['aff','Hoa hồng affiliate (%)','Ước tính trung bình trên doanh số'],
  ['tax','Thuế sàn khấu trừ (%)','Để 0 nếu sàn không khấu trừ'],
  ['other','Chi phí khác (%)','Đóng gói, vận hành… tính theo % doanh số'],
];
const curShop = () => S.cfg.shops.find(s => s.id === S.cfg.shop) || {};
const feeRate = () => { const f = curShop().fees || {}; return FEE_FIELDS.reduce((a,[k]) => a + (+f[k] || 0), 0) / 100; };
const targetMargin = () => (+(curShop().fees || {}).target || 10) / 100;
function skuName(id){ return S.skus.get(id)?.name || productIndex().get(id) || id; }
/* giá vốn cho 1 sản phẩm trong 1 ngày → { v, est } hoặc null nếu chưa có giá vốn */
function cogsOf(id, rev, units, ord){
  const k = S.skus.get(id); if (!k) return null;
  const cost = +k.cost || 0, pct = +k.cost_pct || 0, price = +k.price || 0;
  if (!rev) return { v: 0, est: false };
  if (cost > 0 && units > 0) return { v: cost * units, est: false };
  if (pct > 0) return { v: rev * pct / 100, est: false };
  if (cost > 0 && price > 0) return { v: rev * cost / price, est: true };
  if (cost > 0 && ord > 0) return { v: cost * ord, est: true };
  return null;
}
/* voucher shop phân bổ theo số lượng cho từng sản phẩm trong ngày (từ file đơn) */
const _vcCache = new Map();
function shopVoucherMap(date){
  if (_vcCache.has(date)) return _vcCache.get(date);
  const os = S.ord.get(date); if (!os){ _vcCache.set(date, null); return null; }
  const byName = new Map(); for (const [id, n] of productIndex()) byName.set(norm(n).slice(0,80), id);
  const m = new Map(); let unmatched = 0;
  for (const o of os){
    if (isCancel(o.st)) continue;
    const v = (o.sv || 0) + (o.cs || 0); if (!v) continue;
    const q = o.it.reduce((a,x) => a + (x.q || 1), 0) || 1;
    for (const it of o.it){ const id = byName.get(norm(it.n).slice(0,80)); const part = v * (it.q || 1) / q; if (id) m.set(id, (m.get(id) || 0) + part); else unmatched += part; }
  }
  m.unmatched = unmatched; _vcCache.set(date, m); return m;
}
function profitDay(date, id){
  const x = prodDay(date, id); if (!x) return null;
  const raw = S.prod.get(date).find(r => r.id === id);
  const c = cogsOf(id, x.rev || 0, raw.units || 0, x.ord || 0);
  const vm = shopVoucherMap(date);
  const affPct = (+(curShop().fees || {}).aff || 0) / 100, hasAff = S.aff.has(date);
  const o = { rev: x.rev || 0, ads: x.cost || 0, adRev: x.adRev || 0, fees: (x.rev || 0) * (feeRate() - affPct), aff: hasAff ? (x.affCost || 0) : (x.rev || 0) * affPct, affReal: hasAff,
    vou: vm ? (vm.get(id) || 0) : 0, vouKnown: !!vm, cogs: c ? c.v : null, est: c ? c.est : false };
  return o;
}
function sumProfit(list){
  const s = { rev:0, ads:0, adRev:0, fees:0, aff:0, vou:0, cogs:0, missing:0, revMissing:0, est:false, vouDays:0, days:0 };
  for (const p of list){ if (!p) continue; s.days++; if (p.vouKnown) s.vouDays++;
    if (p.cogs == null){ s.missing++; s.revMissing += p.rev; s.adsMissing = (s.adsMissing || 0) + p.ads; continue; }
    s.rev += p.rev; s.ads += p.ads; s.adRev += p.adRev; s.fees += p.fees; s.aff += p.aff || 0; s.vou += p.vou; s.cogs += p.cogs; s.est = s.est || p.est; }
  return finishProfit(s);
}
function finishProfit(s){
  s.preAds = s.rev - s.cogs - s.fees - (s.aff || 0) - s.vou;
  s.lng = s.preAds - s.ads;
  s.margin = s.rev ? s.preAds / s.rev : null;
  s.lngPct = s.rev ? s.lng / s.rev : null;
  s.be = s.margin > 0 ? 1 / s.margin : null;
  s.roas = s.ads ? s.adRev / s.ads : null;
  s.tacos = s.rev ? s.ads / s.rev : null;
  return s;
}
function profitRange(id, dates){ return sumProfit(dates.map(d => profitDay(d, id))); }
/* ROAS hoà vốn của 1 sản phẩm (30 ngày gần nhất), dùng cho tô màu quảng cáo */
const _beCache = new Map();
function beRoas(itemId, end){
  const key = itemId + '|' + end; if (_beCache.has(key)) return _beCache.get(key);
  const dates = winDates(end, 30); let v = null;
  if (itemId){ const p = profitRange(itemId, dates); v = p.rev ? p.be : null; }
  else { const ids = [...productIndex().keys()]; const all = sumProfit(ids.flatMap(id => dates.map(d => profitDay(d, id)))); v = all.rev ? all.be : null; }
  _beCache.set(key, v); return v;
}
function clearCalcCache(){ _vcCache.clear(); _beCache.clear(); }

/* ---------- Phân rã biến động doanh số ---------- */
function decompose(cur, base){
  if (!cur || !base || !(cur.rev > 0) || !(base.rev > 0) || !(cur.imp > 0) || !(base.imp > 0) || !(cur.clk > 0) || !(base.clk > 0) || !(cur.ord > 0) || !(base.ord > 0)) return null;
  const f = { imp:[cur.imp, base.imp], ctr:[cur.clk/cur.imp, base.clk/base.imp], cr:[cur.ord/cur.clk, base.ord/base.clk], aov:[cur.rev/cur.ord, base.rev/base.ord] };
  const tot = cur.rev / base.rev - 1, lnT = Math.log(cur.rev / base.rev);
  const parts = Object.entries(f).map(([k,[a,b]]) => { const l = Math.log(a/b); return { k, v: lnT ? l / lnT * tot : 0 }; });
  return { tot, parts };
}
const DECOMP_L = { imp:'Hiển thị', ctr:'CTR', cr:'Chuyển đổi', aov:'Giá trị đơn' };
function decompHtml(dc, label){
  if (!dc) return `<span class="muted">Chưa đủ dữ liệu để tách nguyên nhân (cần có đơn ở cả hai kỳ).</span>`;
  const mx = Math.max(.01, ...dc.parts.map(p => Math.abs(p.v)), Math.abs(dc.tot));
  const bar = v => { const w = Math.round(Math.abs(v)/mx*60); return `<span class="dbar"><i class="${v<0?'neg':'pos'}" style="width:${w}px;${v<0?'margin-left:'+(60-w)+'px':'margin-left:60px'}"></i></span>`; };
  const p = v => (v >= 0 ? '+' : '−') + Math.abs(v*100).toFixed(1).replace('.',',') + '%';
  return `<div class="decomp"><div class="drow tot"><span>${esc(label || 'Doanh số')}</span>${bar(dc.tot)}<b class="${dc.tot<0?'neg':'pos'}">${p(dc.tot)}</b></div>
    ${dc.parts.map(x => `<div class="drow"><span>do ${DECOMP_L[x.k]}</span>${bar(x.v)}<b class="${Math.abs(x.v)<.005?'':x.v<0?'neg':'pos'}">${p(x.v)}</b></div>`).join('')}</div>`;
}
function mainCause(dc){
  if (!dc || Math.abs(dc.tot) < .15) return '';
  const top = dc.parts.slice().sort((a,b) => Math.abs(b.v) - Math.abs(a.v))[0];
  if (!top || Math.sign(top.v) !== Math.sign(dc.tot)) return '';
  return `<span class="cause ${dc.tot<0?'neg':'pos'}">${dc.tot<0?'↓':'↑'} ${DECOMP_L[top.k]}</span>`;
}

/* ---------- Tồn kho ---------- */
function coverDays(id, end){
  const k = S.skus.get(id); if (!k || k.stock == null || k.stock === '') return null;
  const ds = winDates(end, 14); let u = 0, n = 0;
  for (const d of ds){ const r = S.prod.get(d)?.find(x => x.id === id); if (r){ u += (r.units || r.ordP || 0); n++; } }
  const perDay = n ? u / n : 0;
  return { stock: +k.stock, perDay, days: perDay > 0 ? +k.stock / perDay : Infinity, lead: +k.lead_days || 0, at: k.stock_at };
}
function stockFlag(id, end){
  const c = coverDays(id, end); if (!c) return '';
  if (c.stock <= 0) return '<span class="chip down">Hết hàng</span>';
  if (c.days < c.lead + 7) return `<span class="chip flag" title="Tồn ${c.stock}, bán ${c.perDay.toFixed(1)}/ngày, về hàng ${c.lead} ngày">Còn ${Math.floor(c.days)} ngày hàng</span>`;
  return '';
}

/* ---------- Sức khoẻ dữ liệu ---------- */
function healthBanner(){
  const y = addDays(todayVN(), -1), miss = [];
  if (!S.prod.has(y)) miss.push('sản phẩm');
  if (!S.ads.has(y)) miss.push('quảng cáo');
  const last = S.lastRaw ? new Date(S.lastRaw) : null;
  const stale = !last || (Date.now() - last.getTime()) > 36*3600e3;
  const noCost = [...(S.prod.get(S.date) || [])].filter(r => r.revP > 0 && !cogsOf(r.id, r.revP, r.units, r.ordP)).length;
  const parts = [];
  if (miss.length) parts.push(`Chưa có số <b>${miss.join(' và ')}</b> ngày ${dm(y)}.`);
  if (stale) parts.push(last ? `Extension gửi dữ liệu lần cuối ${last.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}.` : 'Chưa nhận dữ liệu nào từ extension cho shop này.');
  if (noCost) parts.push(`${noCost} sản phẩm có doanh số nhưng chưa có giá vốn.`);

}

function paretoBlock(rows){

}
function quadChart(rows, medRev, tm){
  if (!rows.length) return '<p class="muted">Chưa có sản phẩm nào đủ giá vốn.</p>';
  const W = 560, H = 300, pl = 48, pr = 12, pt = 12, pb = 30;
  const xs = rows.map(r => r.p.rev), ys = rows.map(r => r.p.lngPct);
  const xmax = Math.max(...xs) * 1.05, ymin = Math.min(-.1, ...ys) - .02, ymax = Math.max(tm + .1, ...ys) + .02;
  const X = v => pl + Math.sqrt(v / xmax) * (W - pl - pr), Y = v => pt + (ymax - v) / (ymax - ymin) * (H - pt - pb);
  const amax = Math.max(1, ...rows.map(r => r.p.ads));
  let s = `<svg class="c" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ma trận doanh số và biên lợi nhuận">`;
  s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}"/><line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(tm)}" y2="${Y(tm)}" stroke-dasharray="4 3"/><line class="grid" x1="${X(medRev)}" x2="${X(medRev)}" y1="${pt}" y2="${H-pb}" stroke-dasharray="4 3"/>`;
  s += `<text x="${pl-6}" y="${Y(0)+4}" text-anchor="end">0%</text><text x="${pl-6}" y="${Y(tm)+4}" text-anchor="end">${Math.round(tm*100)}%</text>`;
  s += `<text x="${W-pr}" y="${H-8}" text-anchor="end">Doanh số →</text><text x="${pl}" y="${H-8}">nhỏ</text>`;
  for (const r of rows){
    const c = r.p.lngPct >= tm ? 'var(--up)' : r.p.lngPct < 0 ? 'var(--down)' : 'var(--flag)';
    const rad = 4 + Math.sqrt(r.p.ads / amax) * 10;
    s += `<circle cx="${X(r.p.rev)}" cy="${Y(r.p.lngPct)}" r="${rad}" fill="${c}" fill-opacity=".55" stroke="${c}" data-pid="${esc(r.id)}" style="cursor:pointer"><title>${esc(r.name)}\nDoanh số ${fmt(r.p.rev,'money')} · LN góp ${fmt(r.p.lngPct,'pct')} · Ads ${fmt(r.p.ads,'money')}</title></circle>`;
  }
  return s + '</svg><p class="muted" style="font-size:12px;margin:4px 0 0">Kích thước chấm = chi phí ads. Đường ngang đứt: mục tiêu biên; đường dọc đứt: doanh số trung vị.</p>';
}

const SKU_COLS = [
  ['short_name','Tên gọn','name'], ['grp','Nhóm (gộp nhiều link)','grp'],
  ['cost','Giá vốn/sp (đ)','num'], ['cost_pct','hoặc % giá vốn','num'], ['price','Giá bán TK (đ)','num'],

async function importSkus(file){
  const wb = /\.csv$/i.test(file.name)
    ? XLSX.read((await file.text()).replace(/^\uFEFF/,''), { type:'string', raw:true })
    : XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:true });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:'' });
  const spec = {
    id:{ t:[h=>inc(h,'ma san pham'), h=>h==='item id', h=>h==='id'] }, name:{ t:[h=>inc(h,'ten san pham'), h=>h==='ten'] },
    cost:{ t:[h=>inc(h,'gia von')&&exc(h,'%','ty le','phan tram')] }, cost_pct:{ t:[h=>inc(h,'gia von')&&(h.includes('%')||inc(h,'ty le')||inc(h,'phan tram'))] },
    price:{ t:[h=>inc(h,'gia ban')] }, brand:{ t:[h=>inc(h,'thuong hieu'), h=>h==='brand'] }, role:{ t:[h=>inc(h,'vai tro')] }, owner:{ t:[h=>inc(h,'phu trach')] },
    short_name:{ t:[h=>inc(h,'ten gon'), h=>inc(h,'ten ngan')] }, grp:{ t:[h=>h.startsWith('nhom')] }, image:{ t:[h=>inc(h,'link anh'), h=>h==='anh', h=>inc(h,'image')] },
    stock:{ t:[h=>inc(h,'ton kho'), h=>h==='ton'] }, stock_at:{ t:[h=>inc(h,'ngay dem'), h=>inc(h,'ngay ton')] }, lead_days:{ t:[h=>inc(h,'ve hang'), h=>inc(h,'lead')] },
  };
  const hd = detectHeader(rows, spec); if (hd.idx < 0) throw new Error('Không thấy cột Mã sản phẩm');
  const map = mapColumns(rows[hd.idx], spec);
  if (map.id == null) throw new Error('Không thấy cột Mã sản phẩm');
  const roleOf = v => { const n = norm(v); return Object.entries(ROLES).find(([k,l]) => n === k || n === norm(l))?.[0] || ''; };
  let n = 0;
  for (const r of rows.slice(hd.idx + 1)){
    const id = String(r[map.id] ?? '').trim().replace(/\.0+$/,''); if (!id || !/\d/.test(id)) continue;
    const d = {};
    for (const f of ['cost','cost_pct','price','stock','lead_days']) if (map[f] != null && r[map[f]] !== '') { const v = num(r[map[f]], 'vi'); if (v != null) d[f] = f === 'cost_pct' && v > 0 && v < 1 ? v*100 : v; }
    for (const f of ['brand','owner','short_name','grp','image']) if (map[f] != null && r[map[f]] !== '') d[f] = String(r[map[f]]).trim();
    if (map.role != null && r[map.role] !== '') d.role = roleOf(r[map.role]);
    if (map.stock_at != null && r[map.stock_at] !== '') d.stock_at = pdate(r[map.stock_at]);
    if (map.name != null && r[map.name] && !productIndex().has(id)) d.name = String(r[map.name]).trim();
    if (Object.keys(d).length){ S.skuDirty[id] = { ...(S.skuDirty[id] || {}), ...d }; n++; }
  }
  return n;
}
async function saveSkus(){
  const rows = Object.entries(S.skuDirty).map(([id, d]) => {
    const cur = { ...(S.skus.get(id) || {}), ...d };
    const o = { shop: S.cfg.shop, item_id: id, name: cur.name || productIndex().get(id) || null };
    for (const f of ['cost','cost_pct','price','stock','lead_days']) o[f] = cur[f] === '' || cur[f] == null ? null : +cur[f];
    for (const f of ['brand','role','owner','short_name','grp','image']) o[f] = (typeof cur[f] === 'string' ? cur[f].trim() : cur[f]) || null;
    o.stock_at = cur.stock_at || null;
    return o;
  });
  for (let i = 0; i < rows.length; i += 200) chk(await sb.from('sv_skus').upsert(rows.slice(i, i+200), { onConflict:'shop,item_id' }));
  for (const r of rows) S.skus.set(r.item_id, r);
  S.skuDirty = {}; clearCalcCache(); resetIdx();
  return rows.length;
}

function reviewDecision(f){
  const lng = f.lng, m = f.prof.rev ? lng / f.prof.rev : null, tm = targetMargin();
  if (m == null) return ['wait', 'Thiếu giá vốn', 'Chưa đủ dữ liệu lợi nhuận để ra quyết định.'];
  if (f.isShop) return m < 0 ? ['down', 'Shop đang lỗ', 'Rà soát các sản phẩm lỗ trong bảng bên dưới.'] : m < tm ? ['wait', 'Lãi dưới mục tiêu', 'Tập trung cắt chi phí ở các sản phẩm lãi mỏng.'] : ['up', 'Shop có lãi tốt', 'Mở rộng ở các sản phẩm nhóm A có lãi.'];
  const big = f.abc === 'A' || (f.shareRev ?? 0) >= .15;
  if (big && m >= tm) return ['up', 'Đẩy mạnh', 'Bán nhiều và có lãi: ưu tiên vốn, tồn kho, ngân sách.'];
  if (big && m < 0) return ['down', 'Sửa lỗ ngay', 'Sản phẩm lớn đang lỗ: kéo lợi nhuận cả shop xuống.'];
  if (big) return ['flag', 'Tối ưu chi phí', 'Bán nhiều nhưng lãi mỏng: giữ doanh số, cắt chi phí.'];
  if (m >= tm) return ['flag', 'Thử tăng trưởng', 'Lãi tốt nhưng bán ít: thử tăng lưu lượng có kiểm soát.'];
  if (m < 0) return ['down', 'Cân nhắc dừng ads / cắt', 'Nhỏ và lỗ: không nên tốn thêm nguồn lực.'];
  return ['wait', 'Duy trì, theo dõi', 'Nhỏ, lãi mỏng: giữ ở mức tối thiểu.'];
}
function reviewScore(R){ let s = 80; for (const l of Object.values(R)) for (const x of l){ if (x.lv === 'bad') s -= 9 * Math.max(1, x.imp / 2); else if (x.lv === 'warn') s -= 4; else if (x.lv === 'good') s += 3; } return Math.max(0, Math.min(100, Math.round(s))); }
function reviewSummary(f, name){
  const c = f.cur, dRev = dlt(c.rev, f.prev?.rev);
  const parts = [`${name} đạt ${fmt(c.rev, 'money')} doanh số trong ${f.n} ngày${dRev != null ? ` (${pctS(dRev)} so với ${f.n} ngày trước)` : ''}${!f.isShop && f.shareRev != null ? `, chiếm ${Math.round(f.shareRev * 100)}% doanh số shop` : ''}.`];
  if (f.lng != null) parts.push(`Lợi nhuận góp ${fmt(f.lng, 'money')} (${pctS(f.prof.rev ? f.lng / f.prof.rev : null, 1)} doanh số).`);
  if (c.adShare != null && c.rev) parts.push(`${Math.round(c.adShare * 100)}% doanh số do quảng cáo mang về, ROAS ${fmt(c.roas, 'x')}${f.prof.be ? ` so với mức hoà vốn ${fmt(f.prof.be, 'x')}` : ''}.`);
  if (!f.isShop && f.peer.n >= 3){ const st = [['ctr', 'thu hút nhấp (CTR)'], ['atcR', 'thêm giỏ'], ['cr', 'chốt đơn']].map(([k, l]) => ({ l, r: c[k] && f.peer[k] ? c[k] / f.peer[k] : null })).filter(x => x.r != null).sort((a, b) => a.r - b.r)[0];
    if (st && st.r < .9) parts.push(`Điểm yếu nhất trong phễu là khâu ${st.l}, ${ratioTxt(st.r)} mặt bằng các sản phẩm khác.`); }

async function readFile(file){
  const name = file.name;
  let rows;
  if (/\.csv$/i.test(name)){
    let text = await file.text(); text = text.replace(/^\uFEFF/,'');
    const wb = XLSX.read(text, { type:'string', raw:true });
    rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:'' });
  } else {
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:true });
    let best = null;
    for (const sn of wb.SheetNames){
      const r = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:true, defval:'' });
      const c = classify(r);
      if (c && (!best || c.ratio > best.c.ratio)) best = { r, c };
      if (!best && !rows) rows = r;
    }
    if (best) rows = best.r;
  }
  return buildPending(name, rows);
}
function buildPending(name, rows, ovIdx){
  const c = classify(rows || []);
  if (!c) return { file:name, err:'Không nhận ra file. Cần file “Hiệu quả sản phẩm”, file quảng cáo hoặc file đơn hàng xuất từ Shopee.', rawRows: rows };
  const ov = {};
  const savedOv = S.cfg.ov?.[c.type] || {};
  for (const k in savedOv) ov[k] = savedOv[k];
  const p = { file:name, type:c.type, hidx:c.idx, rawRows:rows, headers: rows[c.idx].map(String) };
  const applyIdx = (map) => { if (ovIdx) for (const k in ovIdx){ if (ovIdx[k] === '' ) delete map[k]; else map[k] = +ovIdx[k]; } return map; };
  if (c.type === 'prod'){
    let r = parseProd(rows, c.idx, ov);
    if (ovIdx){ const m = applyIdx({ ...r.map }); r = parseWithMap(rows, c.idx, 'prod', m); }
    Object.assign(p, { rows:r.rows, map:r.map });
    p.range = rangeFromName(name) || rangeFromText(rows);
    p.date = p.range && p.range[0] === p.range[1] ? p.range[0] : (p.range ? null : null);
  } else if (c.type === 'ads'){
    let r = parseAds(rows, c.idx, ov);
    if (ovIdx){ const m = applyIdx({ ...r.map }); r = parseWithMap(rows, c.idx, 'ads', m); }
    Object.assign(p, { rows:r.rows, map:r.map });
    p.range = rangeFromText(rows) || rangeFromName(name);
    p.date = p.range && p.range[0] === p.range[1] ? p.range[0] : null;
  } else if (c.type === 'aff'){
    let r = parseAff(rows, c.idx, ov);
    if (ovIdx){ const m = applyIdx({ ...r.map }); r = parseWithMap(rows, c.idx, 'aff', m); }
    Object.assign(p, { byDay:r.byDay, map:r.map, count:r.count, days:[...r.byDay.keys()].sort(), ids:r.ids });
    if (!p.days.length) p.err = 'Không đọc được thời gian đặt hàng trong báo cáo affiliate.';
  } else {
    let r = parseOrders(rows, c.idx, ov);
    if (ovIdx){ const m = applyIdx({ ...r.map }); r = parseWithMap(rows, c.idx, 'ord', m); }
    Object.assign(p, { byDay:r.byDay, map:r.map, count:r.count, days:[...r.byDay.keys()].sort() });
    if (!p.days.length) p.err = 'Không đọc được ngày đặt hàng trong file đơn.';
  }
  p.ok = !p.err;
  p.ovIdx = ovIdx || null;
  return p;
}
/* parse lại với bản đồ cột do người dùng sửa: ghi đè mapColumns bằng chỉ số cột */
function parseWithMap(rows, hidx, type, map){
  const fake = rows.map((r,i) => i === hidx ? r.map((h,j) => '__c' + j) : r);
  const ov = {}; for (const k in map) ov[k] = '__c' + map[k];
  const fn = { prod: parseProd, ads: parseAds, ord: parseOrders, aff: parseAff }[type];
  const res = fn(fake, hidx, ov);
  res.map = map; return res;
}
async function saveAll(){
  const shop = S.cfg.shop; let n = 0;
  const btn = document.getElementById('saveAll'); if (btn){ btn.disabled = true; btn.textContent = 'Đang lưu…'; }
  try{
    for (const p of S.pending.filter(p => p.ok)){
      if (p.type === 'ord'){
        for (const d of p.days){ await Store.put('ord', safeId(shop+'__'+d), { shop, date:d, orders:p.byDay.get(d), file:p.file, at:Date.now() }); S.ord.set(d, p.byDay.get(d)); }
        n++;
      } else if (p.type === 'aff'){
        for (const d of p.days){ await Store.put('aff', safeId(shop+'__'+d), { shop, date:d, rows:p.byDay.get(d), file:p.file }); S.aff.set(d, p.byDay.get(d)); }
        n++;
      } else {
        if (!p.date){ toast(`Chưa chọn ngày cho ${p.file}`); continue; }
        await Store.put(p.type, safeId(shop+'__'+p.date), { shop, date:p.date, rows:p.rows, file:p.file, at:Date.now() });
        (p.type === 'prod' ? S.prod : S.ads).set(p.date, p.rows); n++;
      }
      if (p.ovIdx){
        S.cfg.ov ||= {}; S.cfg.ov[p.type] ||= {};
        for (const k in p.map) S.cfg.ov[p.type][k] = norm(p.headers[p.map[k]]);
        await saveCfg();
      }
    }
    S.pending = S.pending.filter(p => !p.ok || (!['ord','aff'].includes(p.type) && !p.date));
    const last = prodDates().at(-1); if (last) S.date = last;
    toast(`Đã lưu ${n} file`);
  }catch(e){ console.error(e); toast('Lưu thất bại: ' + (e.message || e.code || e)); }
  render();
}

function downloadText(name, text, mime){
  (async () => {
    try{
      const dl = window.claude && await window.claude.use('downloads');
      if (dl){ await dl.save({ filename:name, data:new Blob([text], { type:mime }) }); return; }
    }catch(e){ if (e && e.code && e.code !== 'not_granted'){ toast('Không tải được: ' + (e.message||e.code)); return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type:mime })); a.download = name; a.click();
  })();
}
