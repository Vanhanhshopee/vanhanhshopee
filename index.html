<style>
:root{
  --bg:#E9EDF1; --panel:#FFFFFF; --panel2:#F5F7F9; --ink:#17212B; --ink2:#4A5866; --ink3:#7C8896;
  --line:#D5DCE3; --line2:#E7ECF0;
  --pri:#0E5E66; --pri-soft:#DCEDEE;
  --up:#17834A; --up-soft:#E2F3E8; --down:#C23A2F; --down-soft:#F9E3E0;
  --flag:#C98A10; --flag-soft:#FBF0D6; --muted-soft:#ECEFF2;
  --s1:#0E5E66; --s2:#5B6CC4; --s3:#C98A10; --s4:#A3456E;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121820; --panel:#1A222C; --panel2:#202A35; --ink:#E6ECF2; --ink2:#AEBAC6; --ink3:#7D8996;
    --line:#2E3A47; --line2:#26313C; --pri:#5FC2C9; --pri-soft:#1D3A3E;
    --up:#4CC284; --up-soft:#173628; --down:#F0776B; --down-soft:#3E2220;
    --flag:#E8B04A; --flag-soft:#3A2F17; --muted-soft:#25303B;
    --s1:#5FC2C9; --s2:#8F9CF0; --s3:#E8B04A; --s4:#E07AA6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121820; --panel:#1A222C; --panel2:#202A35; --ink:#E6ECF2; --ink2:#AEBAC6; --ink3:#7D8996;
  --line:#2E3A47; --line2:#26313C; --pri:#5FC2C9; --pri-soft:#1D3A3E;
  --up:#4CC284; --up-soft:#173628; --down:#F0776B; --down-soft:#3E2220;
  --flag:#E8B04A; --flag-soft:#3A2F17; --muted-soft:#25303B;
  --s1:#5FC2C9; --s2:#8F9CF0; --s3:#E8B04A; --s4:#E07AA6; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:500;color:var(--ink3);font-size:12px}
.top-ctl{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.ctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
select,input[type=date],input[type=text],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-height:34px}
textarea{width:100%;min-height:60px;resize:vertical}
.nav{max-width:1440px;margin:0 auto;display:flex;gap:2px;padding:0 14px;overflow-x:auto}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap}
.nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--pri);font-weight:600}
main{max-width:1440px;margin:0 auto;padding:18px 20px 60px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.sec-h h2{font-size:15px;margin:0;font-weight:600}
.sec-h .hint{color:var(--ink3);font-size:12.5px}
.sec-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-b{padding:14px 16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;min-height:34px;font-weight:500}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0D1A1C}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}

tbody tr:hover td{background:var(--panel2)}
tr.click{cursor:pointer}
.pname{max-width:300px;overflow:hidden;text-overflow:ellipsis;display:block;font-weight:500}
.pid{font-size:11.5px;color:var(--ink3)}
.v{display:block}
.d{display:inline-block;font-size:11.5px;font-weight:600;padding:0 5px;border-radius:4px;margin-top:2px}
.d.up{color:var(--up);background:var(--up-soft)}
.d.down{color:var(--down);background:var(--down-soft)}
.d.flat{color:var(--ink3);background:var(--muted-soft)}

.dd{font-size:11.5px;font-weight:600}

.al{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:8px;background:var(--panel2);border-left:4px solid var(--line)}
.al.bad{border-left-color:var(--down)} .al.good{border-left-color:var(--up)} .al.info{border-left-color:var(--flag)}

.ch{border-bottom:1px solid var(--line2);padding:6px 0 2px}

/* ---------- matrix ---------- */
.mx td.cell{min-width:64px;font-size:12.5px}
.mx td.cell span{display:block;font-size:11px;color:var(--ink3)}

.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.grid-f label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.grid-f .wide{grid-column:1/-1}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;cursor:pointer;background:var(--panel2)}
.drop.on{border-color:var(--pri);background:var(--pri-soft)}

.fcard{border:1px solid var(--line);border-radius:8px;margin-top:12px}
.fcard-h{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}

.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--pri-soft);color:var(--pri)}

.map{display:flex;flex-wrap:wrap;gap:6px}

.map span.miss{color:var(--down);border-color:color-mix(in srgb,var(--down) 35%,transparent)}
details summary{cursor:pointer;color:var(--pri);font-size:12.5px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px}
.cal div{border:1px solid var(--line2);border-radius:6px;padding:4px 5px;font-size:11.5px;text-align:center}
.cal i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 1px;background:var(--line)}
.cal i.p{background:var(--s1)} .cal i.a{background:var(--s2)} .cal i.o{background:var(--s3)}
.steps{margin:0;padding-left:20px;color:var(--ink2)} .steps li{margin:3px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-weight:500;z-index:50;max-width:90vw}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr} main{padding:12px 10px 50px} .top-in{padding:10px 12px}}
.store{font-size:12px;color:var(--ink3)}

/* v1.1 */
.evt{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:0 5px;margin-left:4px;background:var(--pri-soft);color:var(--pri);white-space:nowrap}

td.neg,.neg{color:var(--down)} .pos{color:var(--up)}

.dbar{display:block;width:120px;height:10px;background:var(--muted-soft);border-radius:3px;position:relative}
.dbar i{display:block;height:10px;border-radius:3px}
.dbar i.pos{background:var(--up)} .dbar i.neg{background:var(--down)}
.cause{display:inline-block;font-size:11.5px;font-weight:600;margin-left:6px}
.cause.neg{color:var(--down)} .cause.pos{color:var(--up)}
table.sku td{padding:4px 6px} table.sku input,table.sku select{min-height:30px;padding:3px 6px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
"use strict";
/* =====================================================================
   CORE: chuẩn hoá, parse số / ngày, nhận diện cột
   ===================================================================== */
const norm = s => String(s ?? '').replace(/[đĐ]/g,'d').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const inc = (h,...w) => w.every(x => h.includes(x));
const exc = (h,...w) => w.every(x => !h.includes(x));

function num(v, loc='vi'){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim();
  if (!s || s === '-' || s === '--' || s === 'N/A') return null;
  s = s.replace(/%|₫|đ|VND|vnd|\s/g,'');
  const hasDot = s.includes('.'), hasCom = s.includes(',');
  if (hasDot && hasCom){
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.');
    else s = s.replace(/,/g,'');
  } else if (hasCom){
    if (/^-?\d{1,3}(,\d{3}){2,}$/.test(s) || (loc==='en' && /^-?\d{1,3}(,\d{3})+$/.test(s))) s = s.replace(/,/g,'');
    else s = s.replace(',','.');
  } else if (hasDot){
    if (/^-?\d{1,3}(\.\d{3}){2,}$/.test(s) || (loc==='vi' && /^-?\d{1,3}(\.\d{3})+$/.test(s))) s = s.replace(/\./g,'');
  }
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
const iso = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function pdate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return iso(v.getFullYear(), v.getMonth()+1, v.getDate());
  if (typeof v === 'number' && v > 30000 && v < 80000){ const d = new Date(Math.round((v-25569)*864e5)); return iso(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return iso(+m[1],+m[2],+m[3]);
  if ((m = s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))) return iso(+m[3],+m[2],+m[1]);
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return iso(+m[1],+m[2],+m[3]);
  return null;
}
function addDays(d, n){ const t = new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
function dayDiff(a,b){ return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/864e5); }
function winDates(end, n, first){ const out = []; for (let i = n-1; i >= 0; i--){ const d = addDays(end,-i); if (!first || d >= first) out.push(d); } return out; }
const WD = ['CN','T2','T3','T4','T5','T6','T7'];
const wd = d => WD[new Date(d+'T00:00:00Z').getUTCDay()];
const dm = d => d ? d.slice(8,10)+'/'+d.slice(5,7) : '';
function rangeFromName(name){
  const m = String(name).match(/(20\d{6})[^\d]{0,3}(20\d{6})/);
  if (m) return [pdate(m[1]), pdate(m[2])];
  const one = String(name).match(/(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/);
  return one ? [iso(+one[1],+one[2],+one[3]), iso(+one[1],+one[2],+one[3])] : null;
}
function rangeFromText(rows){
  for (const r of rows.slice(0,15)){
    const line = r.join(' ');
    const n = norm(line);
    if (n.includes('khoang thoi gian') || n.includes('thoi gian') || n.includes('period') || n.includes('date range')){
      const ds = [...line.matchAll(/(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{4}|\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2})/g)].map(x=>pdate(x[1]));
      if (ds.length >= 2) return [ds[0], ds[1]];
      if (ds.length === 1) return [ds[0], ds[0]];
    }
  }
  return null;
}

/* --- Bộ nhận diện cột cho 3 loại file. Mỗi trường: danh sách điều kiện theo thứ tự ưu tiên --- */
const SPECS = {
  prod: {
    id:   { label:'Mã sản phẩm', t:[h=>h==='ma san pham', h=>inc(h,'ma san pham')&&exc(h,'phan loai'), h=>h==='item id'] },
    name: { label:'Tên sản phẩm', t:[h=>h==='san pham', h=>h==='ten san pham', h=>inc(h,'ten san pham')] },
    vid:  { label:'Mã phân loại', t:[h=>inc(h,'ma phan loai'), h=>inc(h,'model id')], opt:1 },
    imp:  { label:'Lượt hiển thị', t:[h=>inc(h,'luot hien thi')&&exc(h,'duy nhat','ty le')] },
    clk:  { label:'Lượt nhấp', t:[h=>inc(h,'luot nhap')&&exc(h,'duy nhat','tim kiem','ty le'), h=>inc(h,'luot click')&&exc(h,'duy nhat','tim kiem','ty le')] },
    pv:   { label:'Lượt xem trang', t:[h=>inc(h,'luot xem trang')] },
    vis:  { label:'Khách truy cập', t:[h=>inc(h,'khach truy cap'), h=>inc(h,'luot truy cap san pham')&&exc(h,'gio hang')], opt:1 },
    atc:  { label:'Thêm vào giỏ', t:[h=>h.startsWith('san pham (them vao gio'), h=>inc(h,'them vao gio')&&exc(h,'ty le','truy cap')] },
    ordP: { label:'Đơn (đã đặt)', t:[h=>h.startsWith('don hang')&&inc(h,'da dat'), h=>h==='don hang'] },
    ordC: { label:'Đơn (xác nhận)', t:[h=>h.startsWith('don hang')&&inc(h,'xac nhan')], opt:1 },
    revP: { label:'Doanh số (đã đặt)', t:[h=>h.startsWith('doanh so')&&inc(h,'da dat'), h=>h.startsWith('doanh so')&&exc(h,'xac nhan','tren moi','truc tiep')] },
    revC: { label:'Doanh số (xác nhận)', t:[h=>h.startsWith('doanh so')&&inc(h,'xac nhan')], opt:1 },
    units:{ label:'SP bán', t:[h=>h.startsWith('san pham (')&&inc(h,'dat')&&exc(h,'them')], opt:1 },
    buyers:{label:'Người mua', t:[h=>inc(h,'nguoi mua')&&exc(h,'ty le')], opt:1 },
  },

function detectHeader(rows, spec){
  let best = -1, bestScore = 0;
  for (let i = 0; i < Math.min(rows.length, 25); i++){
    const hs = rows[i].map(norm);
    let sc = 0;
    for (const k in spec) if (hs.some(h => h && spec[k].t.some(f => f(h)))) sc++;
    if (sc > bestScore){ bestScore = sc; best = i; }
  }
  return { idx: best, score: bestScore };
}
function mapColumns(headers, spec, overrides={}){
  const hs = headers.map(norm), used = new Set(), map = {};
  for (const k in spec){
    const ov = overrides[k];
    if (ov != null){ const j = hs.indexOf(ov); if (j >= 0 && !used.has(j)){ map[k] = j; used.add(j); continue; } }
    for (const f of spec[k].t){
      const j = hs.findIndex((h,ix) => h && !used.has(ix) && f(h));
      if (j >= 0){ map[k] = j; used.add(j); break; }
    }
  }
  return map;
}
function classify(rows){
  let best = null;
  for (const type of ['ord','ads','prod']){
    const h = detectHeader(rows, SPECS[type]);
    const req = Object.keys(SPECS[type]).filter(k => !SPECS[type][k].opt).length;
    const need = type === 'ord' ? 3 : 3;
    if (h.score >= need){
      const hs = rows[h.idx].map(norm);
      if (type === 'ord' && !hs.some(x => inc(x,'ma don hang'))) continue;
      if (type === 'ads' && !hs.some(x => x === 'chi phi' || x.startsWith('chi phi'))) continue;
      if (!best || h.score/req > best.ratio) best = { type, idx: h.idx, ratio: h.score/req };
    }
  }
  return best;
}

/* --- Parse 3 loại file --- */
function parseProd(rows, hidx, ov){
  const headers = rows[hidx], map = mapColumns(headers, SPECS.prod, ov);
  const g = (r,k) => map[k] == null ? null : r[map[k]];
  const groups = new Map();
  for (const r of rows.slice(hidx+1)){
    let id = String(g(r,'id') ?? '').trim();
    if (!id || !/\d/.test(id)) continue;
    id = id.replace(/\.0+$/,'');
    const vid = String(g(r,'vid') ?? '').trim();
    const rec = { id, name: String(g(r,'name') ?? '').trim(), parent: !vid || vid === '-' || vid === '--' };
    for (const k of ['imp','clk','pv','vis','atc','ordP','ordC','revP','revC','units','buyers']) rec[k] = num(g(r,k),'vi') ?? 0;
    if (!groups.has(id)) groups.set(id, []);
    groups.get(id).push(rec);
  }
  const out = [];
  for (const [id, list] of groups){
    const parent = list.find(x => x.parent);
    if (parent){ out.push(clean(parent)); continue; }
    const s = { id, name: list[0].name };
    for (const k of ['imp','clk','pv','vis','atc','ordP','ordC','revP','revC','units','buyers']) s[k] = list.reduce((a,x)=>a+x[k],0);
    out.push(clean(s));
  }
  function clean(x){ const o = {...x}; delete o.parent; if (!o.ordP && o.ordC) o.ordP = o.ordC; if (!o.revP && o.revC) o.revP = o.revC; return o; }
  return { rows: out, map, headers };
}
function parseAds(rows, hidx, ov){
  const headers = rows[hidx], map = mapColumns(headers, SPECS.ads, ov);
  const g = (r,k) => map[k] == null ? null : r[map[k]];
  const out = [];
  for (const r of rows.slice(hidx+1)){
    const name = String(g(r,'name') ?? '').trim();
    if (!name) continue;
    const rec = { name, type: String(g(r,'type') ?? '').trim(), status: String(g(r,'status') ?? '').trim(),
      itemId: String(g(r,'itemId') ?? '').trim().replace(/\.0+$/,'').replace(/^-$/,'') };
    for (const k of ['imp','clk','atc','conv','units','rev','cost']) rec[k] = num(g(r,k),'en') ?? 0;
    rec.roasT = num(g(r,'roasT'),'en'); rec.budget = num(g(r,'budget'),'en');
    if (norm(name).startsWith('tong') ) continue;
    out.push(rec);
  }
  return { rows: out, map, headers };
}
function parseOrders(rows, hidx, ov){
  const headers = rows[hidx], map = mapColumns(headers, SPECS.ord, ov);
  const g = (r,k) => map[k] == null ? null : r[map[k]];
  const orders = new Map();
  for (const r of rows.slice(hidx+1)){
    const oid = String(g(r,'oid') ?? '').trim();
    if (!oid) continue;
    let o = orders.get(oid);
    if (!o){
      o = { i: oid, d: pdate(g(r,'date')), st: String(g(r,'status') ?? '').trim(), g: 0, sr: 0, er: 0, sv: 0, ev: 0, cs: 0, ce: 0, x: 0, cd: 0, it: [] };
      orders.set(oid, o);
    }
    const qty = num(g(r,'qty'),'vi') ?? 1;
    const line = num(g(r,'line'),'vi') ?? ((num(g(r,'deal'),'vi') ?? 0) * qty);
    o.g += line;
    o.sr += num(g(r,'sellerReb'),'vi') ?? 0;
    o.er += num(g(r,'shopeeReb'),'vi') ?? 0;
    o.sv = Math.max(o.sv, num(g(r,'shopV'),'vi') ?? 0);
    o.ev = Math.max(o.ev, num(g(r,'shopeeV'),'vi') ?? 0);
    o.cs = Math.max(o.cs, num(g(r,'comboShop'),'vi') ?? 0);
    o.ce = Math.max(o.ce, num(g(r,'comboShopee'),'vi') ?? 0);
    o.x  = Math.max(o.x,  num(g(r,'coins'),'vi') ?? 0);
    o.cd = Math.max(o.cd, num(g(r,'card'),'vi') ?? 0);
    const nm = String(g(r,'name') ?? '').trim();
    if (nm) o.it.push({ n: nm.slice(0,90), q: qty });
  }
  const byDay = new Map();
  for (const o of orders.values()){
    if (!o.d) continue;
    if (!byDay.has(o.d)) byDay.set(o.d, []);
    byDay.get(o.d).push(o);
  }
  return { byDay, map, headers, count: orders.size };
}

const chk = ({ data, error }) => { if (error) throw new Error(error.message || String(error)); return data; };
const Store = {

const nf = new Intl.NumberFormat('vi-VN');
function fmt(v, f){
  if (v == null || !isFinite(v)) return '—';
  if (f === 'int') return nf.format(Math.round(v));
  if (f === 'pct') return (v*100).toFixed(2).replace('.',',') + '%';
  if (f === 'x') return v.toFixed(2).replace('.',',');
  if (f === 'money'){
    const a = Math.abs(v);
    if (a >= 1e9) return (v/1e9).toFixed(2).replace('.',',') + ' tỷ';
    if (a >= 1e6) return (v/1e6).toFixed(a >= 1e8 ? 0 : 1).replace('.',',') + 'tr';
    if (a >= 1e3) return Math.round(v/1e3) + 'k';
    return nf.format(Math.round(v));
  }
  if (f === 'vnd') return nf.format(Math.round(v)) + 'đ';
  return String(v);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function delta(cur, base){
  if (cur == null || base == null || !isFinite(cur) || !isFinite(base)) return null;
  if (base === 0) return cur === 0 ? 0 : null;
  return (cur - base) / Math.abs(base);
}
function dchip(cur, base, m, cls='d', small){
  const dv = delta(cur, base);
  if (dv == null) return `<span class="${cls} flat">mới</span>`;
  if (cur === base) return `<span class="${cls} flat">0%</span>`;
  const s = (dv > 0 ? '+' : '−') + Math.abs(dv*100).toFixed(Math.abs(dv) < .1 ? 1 : 0).replace('.',',') + '%';
  let dir = Math.abs(dv) < .03 ? 'flat' : dv > 0 ? 'up' : 'down';
  if (m && m.inv && dir !== 'flat') dir = dir === 'up' ? 'down' : 'up';
  if (m && m.neutral && dir !== 'flat') dir = 'neu';
  if (small) dir = 'flat';
  return `<span class="${cls} ${dir}">${s}</span>`;
}

}
function derive(b, ad){
  if (!b) return null;
  const o = { imp:b.imp, clk:b.clk, pv:b.pv, atc:b.atc, ord:b.ordP, rev:b.revP, units:b.units };
  o.ctr = b.imp ? b.clk/b.imp : null; o.atcR = b.clk ? b.atc/b.clk : null; o.cr = b.clk ? b.ordP/b.clk : null;
  o.cost = ad ? ad.cost : null; o.adRev = ad ? ad.rev : null; o.roas = ad && ad.cost ? ad.rev/ad.cost : null;
  return o;
}

  const sum = {}; for (const k of ['imp','clk','pv','atc','ord','rev','cost','adRev']) sum[k] = xs.reduce((a,x)=>a+(x[k]||0),0)/xs.length;
  sum.ctr = sum.imp ? sum.clk/sum.imp : null; sum.atcR = sum.clk ? sum.atc/sum.clk : null; sum.cr = sum.clk ? sum.ord/sum.clk : null;
  sum.roas = sum.cost ? sum.adRev/sum.cost : null; sum.n = xs.length;
  return sum;
}

function chart({ dates, series, markers = [], h = 110, axis = false }){
  const W = 860, pl = 58, pr = 52, pt = 10, pb = axis ? 22 : 6, H = h;
  const n = dates.length; if (!n) return '';
  const bw = (W - pl - pr) / n, cx = i => pl + bw*(i+.5);
  const ih = H - pt - pb;
  let out = `<svg class="c" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.l).join(', '))}">`;
  for (let g = 0; g <= 2; g++){ const y = pt + ih*g/2; out += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/>`; }
  series.forEach((s, si) => {

function phi(x){ const t = 1/(1+.2316419*Math.abs(x)); const d = .3989423*Math.exp(-x*x/2); const p = d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return x > 0 ? 1-p : p; }
function ztest(x1,n1,x2,n2){
  if (n1 < 1 || n2 < 1) return null;
  const p1 = x1/n1, p2 = x2/n2, p = (x1+x2)/(n1+n2), se = Math.sqrt(p*(1-p)*(1/n1+1/n2));

  const z = (p2-p1)/se; return { p1, p2, z, pv: 2*(1-phi(Math.abs(z))) };

const CHG_TYPES = {
  anh:   { l:'Ảnh / video bìa', win:5, focus:['ctr','imp'] },
  tieude:{ l:'Tiêu đề', win:5, focus:['ctr','imp'] },
  mota:  { l:'Mô tả / video', win:7, focus:['atcR','cr'] },
  gia:   { l:'Giá / khuyến mãi', win:7, focus:['atcR','cr','rev'] },
  voucher:{l:'Voucher shop', win:7, focus:['cr','ord'] },
  roas:  { l:'Ads: mục tiêu ROAS', win:7, focus:['imp','cost','roas'] },
  budget:{ l:'Ads: ngân sách', win:7, focus:['imp','cost','roas'] },
  ads_on:{ l:'Ads: bật / tắt', win:7, focus:['imp','clk','ord'] },
  khac:  { l:'Khác', win:7, focus:['ctr','cr','ord'] },

function evalChange(c){
  const fn = c.pid === '*' ? shopDay : d => prodDay(d, c.pid);
  const W = +c.win || CHG_TYPES[c.type]?.win || 7;
  const beforeD = [], afterD = [];
  let skipped = 0;
  for (let i = 1; beforeD.length < W && i <= W*3; i++){ const d = addDays(c.date,-i); if (isEvent(d)) skipped++; else beforeD.push(d); }
  for (let i = 1; afterD.length < W && i <= W*3; i++){ const d = addDays(c.date,i); if (isEvent(d)) skipped++; else afterD.push(d); }
  const sum = ds => { const xs = ds.map(fn).filter(Boolean); const s = { n: xs.length };
    for (const k of ['imp','clk','atc','ord','rev','cost','adRev']) s[k] = xs.reduce((a,x)=>a+(x[k]||0),0); return s; };
  const b = sum(beforeD), a = sum(afterD);
  const res = { W, b, a, rows: [], skipped };
  const rateRow = (k, num, den) => {
    const t = ztest(b[num], b[den], a[num], a[den]);
    return { k, before: b[den] ? b[num]/b[den] : null, after: a[den] ? a[num]/a[den] : null, t, enough: (b[num]+a[num]) >= 12 && b[den] >= 50 && a[den] >= 50 };
  };
  const avgRow = (k) => ({ k, before: b.n ? b[k]/b.n : null, after: a.n ? a[k]/a.n : null });
  for (const k of CHG_TYPES[c.type]?.focus || ['ctr','cr']){
    if (k === 'ctr') res.rows.push(rateRow('ctr','clk','imp'));
    else if (k === 'atcR') res.rows.push(rateRow('atcR','atc','clk'));
    else if (k === 'cr') res.rows.push(rateRow('cr','ord','clk'));
    else if (k === 'roas') res.rows.push({ k, before: b.cost ? b.adRev/b.cost : null, after: a.cost ? a.adRev/a.cost : null });
    else res.rows.push(avgRow(k));
  }
  const main = res.rows[0];
  if (a.n < W) res.verdict = { cls:'wait', t:`Đang chờ dữ liệu (${a.n}/${W} ngày sau)` };
  else if (b.n < Math.ceil(W/2)) res.verdict = { cls:'wait', t:'Thiếu dữ liệu trước thay đổi' };
  else if (main.t){
    if (!main.enough) res.verdict = { cls:'wait', t:'Số liệu còn quá ít để kết luận' };
    else if (main.t.pv < .05) res.verdict = main.after > main.before ? { cls:'up', t:`${M[main.k].l} tăng có ý nghĩa` } : { cls:'down', t:`${M[main.k].l} giảm có ý nghĩa` };
    else res.verdict = { cls:'wait', t:'Chưa thấy khác biệt rõ' };
  } else {
    const dv = delta(main.after, main.before);
    res.verdict = dv == null ? { cls:'wait', t:'Chưa đủ dữ liệu' } : Math.abs(dv) < .1 ? { cls:'wait', t:'Gần như không đổi' } : dv > 0 ? { cls:'up', t:`${M[main.k].l} +${Math.round(dv*100)}%` } : { cls:'down', t:`${M[main.k].l} −${Math.round(-dv*100)}%` };
  }
  res.overlap = S.chg.filter(o => o !== c && (o.pid === c.pid || o.pid === '*' || c.pid === '*') && Math.abs(dayDiff(o.date, c.date)) <= W);
  return res;
}

const ADS_METRICS = {
  cost:{ l:'Chi phí', f:'money', get:r => r.cost },
  roas:{ l:'ROAS', f:'x', get:r => r.cost ? r.rev/r.cost : null },
  rev: { l:'Doanh số', f:'money', get:r => r.rev },
  conv:{ l:'Chuyển đổi', f:'int', get:r => r.conv || r.units },
  clk: { l:'Click', f:'int', get:r => r.clk },
  imp: { l:'Hiển thị', f:'int', get:r => r.imp },
  cpc: { l:'CPC', f:'vnd', inv:1, get:r => r.clk ? r.cost/r.clk : null },
  ctr: { l:'CTR', f:'pct', get:r => r.imp ? r.clk/r.imp : null },
};
function viewAds(){
  if (!S.ads.size) return emptyState('ads');
  const end = S.date && S.ads.has(S.date) ? S.date : [...S.ads.keys()].sort().at(-1);
  const dates = winDates(end, S.adsRange, [...S.ads.keys()].sort()[0]);
  const camps = new Map();
  for (const d of dates) for (const r of (S.ads.get(d) || [])){
    if (!camps.has(r.name)) camps.set(r.name, { name:r.name, type:r.type, itemId:r.itemId, days:{} });
    camps.get(r.name).days[d] = r;
  }
  const am = ADS_METRICS[S.adsMetric];
  const sumR = rs => rs.reduce((a,r) => ({ cost:a.cost+r.cost, rev:a.rev+r.rev, clk:a.clk+r.clk, imp:a.imp+r.imp, conv:a.conv+(r.conv||r.units||0), units:0 }), { cost:0, rev:0, clk:0, imp:0, conv:0 });
  const list = [...camps.values()].map(c => ({ ...c, tot: sumR(Object.values(c.days)) })).sort((a,b) => b.tot.cost - a.tot.cost);
  const dayTot = dates.map(d => S.ads.has(d) ? sumR(S.ads.get(d)) : null);
  const rmax = Math.max(1e-9, ...list.flatMap(c => dates.map(d => c.days[d] ? (am.get(c.days[d]) ?? 0) : 0)));
  const beOf = c => beRoas(c.itemId && productIndex().has(c.itemId) ? c.itemId : null, end);
  const shade = (val, be) => {
    if (val == null) return '';
    if (S.adsMetric === 'roas'){ if (!be) return ''; const ok = val >= be*1.2 ? 'var(--up-soft)' : val >= be ? 'var(--muted-soft)' : 'var(--down-soft)'; return `background:${ok}`; }
    const a = Math.min(1, val / rmax); return `background:color-mix(in srgb,var(--s1) ${Math.round(a*38)}%,transparent)`;
  };
  if (!S.adsSel || !camps.has(S.adsSel)) S.adsSel = list[0]?.name;
  const sel = camps.get(S.adsSel);
  const c1 = css('--s1'), c2 = css('--s2'), c4 = css('--s4');
  const totChart = chartBlock('Toàn bộ quảng cáo', [{ l:'Chi phí', vals: dayTot.map(t => t?.cost ?? null), c:c4, f:'money', bar:1 }, { l:'ROAS', vals: dayTot.map(t => t && t.cost ? t.rev/t.cost : null), c:c2, f:'x' }], dates, S.chg.filter(c => ['roas','budget','ads_on'].includes(c.type) && dates.includes(c.date)).map(c => ({ date:c.date })), true);
  const detail = sel ? dates.slice().reverse().map(d => ({ d, r: sel.days[d], p: sel.days[addDays(d,-1)] })) : [];
  const dcols = ['cost','imp','clk','ctr','cpc','conv','rev','roas'];
  return `
  <section class="sec">
    <div class="sec-h"><h2>Chi phí và ROAS theo ngày</h2><div class="right"><div class="seg" role="group" aria-label="Khoảng ngày">${[7,14,30].map(n => `<button data-arange="${n}" aria-pressed="${S.adsRange===n}">${n} ngày</button>`).join('')}</div></div></div>
    <div class="sec-b">${totChart}</div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Chiến dịch × ngày</h2><span class="hint">Ô trống = không chạy hoặc chưa có số. ROAS đỏ = thấp hơn ROAS hoà vốn của sản phẩm</span>
      <div class="right"><div class="seg" role="group" aria-label="Chỉ số">${Object.entries(ADS_METRICS).map(([k,m]) => `<button data-am="${k}" aria-pressed="${S.adsMetric===k}">${m.l}</button>`).join('')}</div></div></div>
    <div class="tw"><table class="mx"><thead><tr><th>Chiến dịch</th><th>Tổng kỳ</th><th title="ROAS hoà vốn từ giá vốn + phí sàn, 30 ngày">ROAS HV</th>${dates.map(d => `<th>${wd(d)}<br>${dm(d)}</th>`).join('')}</tr></thead><tbody>
      <tr class="total"><td>Tất cả</td><td>${fmt(am.get(sumR(dayTot.filter(Boolean))), am.f)}</td><td>${fmt(beRoas(null, end),'x')}</td>${dayTot.map(t => `<td class="cell">${t ? fmt(am.get(t), am.f) : '—'}</td>`).join('')}</tr>
      ${list.map(c => `<tr class="click" data-camp="${esc(c.name)}"><td><span class="pname" title="${esc(c.name)}">${esc(c.name)}</span><span class="pid">${esc(c.type)}${c.itemId ? ' · '+esc(c.itemId) : ''}</span></td>
        <td><b>${fmt(am.get(c.tot), am.f)}</b></td><td>${(() => { const be = beOf(c); return be ? `<span class="${c.tot.cost && c.tot.rev/c.tot.cost < be ? 'neg' : ''}">${fmt(be,'x')}</span>` : '<span class="muted" title="Chưa có giá vốn">—</span>'; })()}</td>
        ${dates.map(d => { const r = c.days[d]; const val = r ? am.get(r) : null; const be = beOf(c); return `<td class="cell" style="${shade(val, be)}" title="${r ? esc(`${dm(d)} · chi ${fmt(r.cost,'vnd')} · DS ${fmt(r.rev,'vnd')} · ROAS ${fmt(r.cost?r.rev/r.cost:null,'x')}`) : ''}">${r ? fmt(val, am.f) : ''}${r && S.adsMetric==='cost' ? `<span class="${be && r.cost && r.rev/r.cost < be ? 'neg' : ''}">${r.cost ? 'R ' + fmt(r.rev/r.cost,'x') : ''}</span>` : ''}</td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>
  </section>
  ${sel ? `<section class="sec">
    <div class="sec-h"><h2>Chi tiết theo ngày</h2><span class="hint">${esc(sel.name.slice(0,100))}</span></div>
    <div class="tw"><table><thead><tr><th>Ngày</th>${dcols.map(k => `<th>${ADS_METRICS[k].l}</th>`).join('')}<th>Mục tiêu ROAS</th><th>Ngân sách</th></tr></thead><tbody>
      ${detail.map(({d,r,p}) => `<tr class="${S.chg.some(c => c.date===d && (c.pid===sel.itemId || c.pid==='*')) ? 'chg' : ''}"><td>${dm(d)}<span class="wk">${wd(d)}</span></td>${dcols.map(k => { const m = ADS_METRICS[k]; return `<td>${r ? `<span class="v">${fmt(m.get(r), m.f)}</span>${p ? dchip(m.get(r), m.get(p), k==='cost' ? {neutral:1} : m, 'dd') : ''}` : '<span class="muted">—</span>'}</td>`; }).join('')}<td>${r?.roasT ?? '—'}</td><td>${r?.budget != null ? fmt(r.budget,'money') : '—'}</td></tr>`).join('')}
    </tbody></table></div>
  </section>` : ''}`;
}

function vcDay(d){
  const os = S.ord.get(d); if (!os || !os.length) return null;
  const ok = os.filter(o => !isCancel(o.st));
  const r = { n: ok.length, cancel: os.length - ok.length, gmv:0, eFund:0, sFund:0, ev:0, evN:0, sv:0, svN:0, x:0 };
  for (const o of ok){
    r.gmv += o.g; r.eFund += o.ev + o.er + o.ce + o.x; r.sFund += o.sv + o.sr + o.cs;
    r.ev += o.ev; if (o.ev > 0) r.evN++; r.sv += o.sv; if (o.sv > 0) r.svN++; r.x += o.x;
  }
  r.eRate = r.gmv ? r.eFund/r.gmv : null; r.sRate = r.gmv ? r.sFund/r.gmv : null;
  r.evPct = r.n ? r.evN/r.n : null; r.evAvg = r.evN ? r.ev/r.evN : null; r.cancelRate = os.length ? r.cancel/os.length : null;
  return r;
}
function viewVc(){
  if (!S.ord.size) return emptyState('ord');
  const end = S.date && S.ord.has(S.date) ? S.date : [...S.ord.keys()].sort().at(-1);
  const dates = winDates(end, S.vcRange, [...S.ord.keys()].sort()[0]);
  const vs = dates.map(vcDay);
  const sig = (v, i) => {
    if (!v || v.n < 3) return '<span class="muted">—</span>';
    const prev = vs.slice(Math.max(0,i-14), i).filter(Boolean).map(x => x.eRate);
    const med = median(prev); if (med == null || prev.length < 3) return '<span class="muted">chưa đủ mốc</span>';
    if (v.eRate > med*1.3) return '<span class="chip flag">Sàn đẩy mạnh</span>';
    if (v.eRate < med*.7) return '<span class="chip wait">Sàn trợ thấp</span>';
    return '<span class="muted">Bình thường</span>';
  };
  const c1 = css('--s1'), c2 = css('--s2'), c3 = css('--s3'), c4 = css('--s4');
  const adsCost = dates.map(d => S.ads.has(d) ? S.ads.get(d).reduce((a,r)=>a+r.cost,0) : null);
  return `
  <section class="sec">
    <div class="sec-h"><h2>Mức trợ giá của Shopee theo ngày</h2><span class="hint">Tính trên đơn không huỷ: (voucher Shopee + Shopee trợ giá + combo Shopee + Xu) ÷ GMV</span>
      <div class="right"><div class="seg" role="group" aria-label="Khoảng ngày">${[14,30,60].map(n => `<button data-vrange="${n}" aria-pressed="${S.vcRange===n}">${n} ngày</button>`).join('')}</div></div></div>
    <div class="sec-b"><div class="charts">
      ${chartBlock('', [{ l:'% GMV Shopee trợ', vals: vs.map(v => v?.eRate ?? null), c:c3, f:'pct', bar:1 }, { l:'% đơn có voucher Shopee', vals: vs.map(v => v?.evPct ?? null), c:c2, f:'pct' }], dates, [])}
      ${chartBlock('', [{ l:'Đơn (không huỷ)', vals: vs.map(v => v?.n ?? null), c:c1, f:'int', bar:1 }, { l:'Chi ads', vals: adsCost, c:c4, f:'money' }], dates, [], true)}
    </div></div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Sổ voucher theo ngày</h2><span class="hint">“Sàn đẩy mạnh” khi mức trợ vượt 30% so với trung vị 14 ngày trước</span></div>
    <div class="tw"><table><thead><tr><th>Ngày</th><th>Đơn</th><th>Huỷ</th><th>GMV</th><th>Shopee trợ</th><th>% GMV</th><th>% đơn có voucher sàn</th><th>Voucher sàn TB/đơn</th><th>Xu</th><th>Shop tự trợ</th><th>% GMV</th><th>Chi ads</th><th class="l">Tín hiệu</th></tr></thead><tbody>
      ${dates.map((d,i) => ({d,i,v:vs[i]})).reverse().map(({d,i,v}) => `<tr><td>${dm(d)}<span class="wk">${wd(d)}</span></td>${v ? `<td>${v.n}</td><td>${v.cancel}</td><td>${fmt(v.gmv,'money')}</td><td>${fmt(v.eFund,'money')}</td><td><b>${fmt(v.eRate,'pct')}</b></td><td>${fmt(v.evPct,'pct')}</td><td>${fmt(v.evAvg,'vnd')}</td><td>${fmt(v.x,'money')}</td><td>${fmt(v.sFund,'money')}</td><td>${fmt(v.sRate,'pct')}</td>` : '<td colspan="10" class="muted" style="text-align:center">chưa có đơn</td>'}<td>${adsCost[i] != null ? fmt(adsCost[i],'money') : '—'}</td><td class="l">${sig(v,i)}</td></tr>`).join('')}
    </tbody></table></div>
  </section>`;
}

function cogsOf(id, rev, units, ord){

  if (pct > 0) return { v: rev * pct / 100, est: false };

  if (_vcCache.has(date)) return _vcCache.get(date);

    for (const it of o.it){ const id = byName.get(norm(it.n).slice(0,80)); const part = v * (it.q || 1) / q; if (id) m.set(id, (m.get(id) || 0) + part); else unmatched += part; }

function finishProfit(s){
  s.preAds = s.rev - s.cogs - s.fees - s.vou;
  s.lng = s.preAds - s.ads;
  s.margin = s.rev ? s.preAds / s.rev : null;
  s.lngPct = s.rev ? s.lng / s.rev : null;
  s.be = s.margin > 0 ? 1 / s.margin : null;
  s.roas = s.ads ? s.adRev / s.ads : null;
  s.tacos = s.rev ? s.ads / s.rev : null;
  return s;
}
function profitRange(id, dates){ return sumProfit(dates.map(d => profitDay(d, id))); }
/* ROAS hoà vốn của 1 sản phẩm (30 ngày gần nhất), dùng cho tô màu quảng cáo */
const _beCache = new Map();
function beRoas(itemId, end){
  const key = itemId + '|' + end; if (_beCache.has(key)) return _beCache.get(key);
  const dates = winDates(end, 30); let v = null;
  if (itemId){ const p = profitRange(itemId, dates); v = p.rev ? p.be : null; }
  else { const ids = [...productIndex().keys()]; const all = sumProfit(ids.flatMap(id => dates.map(d => profitDay(d, id)))); v = all.rev ? all.be : null; }
  _beCache.set(key, v); return v;
}
function clearCalcCache(){ _vcCache.clear(); _beCache.clear(); }

/* ---------- Phân rã biến động doanh số ---------- */
function decompose(cur, base){
  if (!cur || !base || !(cur.rev > 0) || !(base.rev > 0) || !(cur.imp > 0) || !(base.imp > 0) || !(cur.clk > 0) || !(base.clk > 0) || !(cur.ord > 0) || !(base.ord > 0)) return null;
  const f = { imp:[cur.imp, base.imp], ctr:[cur.clk/cur.imp, base.clk/base.imp], cr:[cur.ord/cur.clk, base.ord/base.clk], aov:[cur.rev/cur.ord, base.rev/base.ord] };
  const tot = cur.rev / base.rev - 1, lnT = Math.log(cur.rev / base.rev);
  const parts = Object.entries(f).map(([k,[a,b]]) => { const l = Math.log(a/b); return { k, v: lnT ? l / lnT * tot : 0 }; });
  return { tot, parts };
}
const DECOMP_L = { imp:'Hiển thị', ctr:'CTR', cr:'Chuyển đổi', aov:'Giá trị đơn' };
function decompHtml(dc, label){
  if (!dc) return `<span class="muted">Chưa đủ dữ liệu để tách nguyên nhân (cần có đơn ở cả hai kỳ).</span>`;
  const mx = Math.max(.01, ...dc.parts.map(p => Math.abs(p.v)), Math.abs(dc.tot));
  const bar = v => { const w = Math.round(Math.abs(v)/mx*60); return `<span class="dbar"><i class="${v<0?'neg':'pos'}" style="width:${w}px;${v<0?'margin-left:'+(60-w)+'px':'margin-left:60px'}"></i></span>`; };
  const p = v => (v >= 0 ? '+' : '−') + Math.abs(v*100).toFixed(1).replace('.',',') + '%';
  return `<div class="decomp"><div class="drow tot"><span>${esc(label || 'Doanh số')}</span>${bar(dc.tot)}<b class="${dc.tot<0?'neg':'pos'}">${p(dc.tot)}</b></div>
    ${dc.parts.map(x => `<div class="drow"><span>do ${DECOMP_L[x.k]}</span>${bar(x.v)}<b class="${Math.abs(x.v)<.005?'':x.v<0?'neg':'pos'}">${p(x.v)}</b></div>`).join('')}</div>`;
}
function mainCause(dc){
  if (!dc || Math.abs(dc.tot) < .15) return '';
  const top = dc.parts.slice().sort((a,b) => Math.abs(b.v) - Math.abs(a.v))[0];
  if (!top || Math.sign(top.v) !== Math.sign(dc.tot)) return '';
  return `<span class="cause ${dc.tot<0?'neg':'pos'}">${dc.tot<0?'↓':'↑'} ${DECOMP_L[top.k]}</span>`;
}

/* ---------- Tồn kho ---------- */
function coverDays(id, end){
  const k = S.skus.get(id); if (!k || k.stock == null || k.stock === '') return null;
  const ds = winDates(end, 14); let u = 0, n = 0;
  for (const d of ds){ const r = S.prod.get(d)?.find(x => x.id === id); if (r){ u += (r.units || r.ordP || 0); n++; } }
  const perDay = n ? u / n : 0;
  return { stock: +k.stock, perDay, days: perDay > 0 ? +k.stock / perDay : Infinity, lead: +k.lead_days || 0, at: k.stock_at };
}
function stockFlag(id, end){
  const c = coverDays(id, end); if (!c) return '';
  if (c.stock <= 0) return '<span class="chip down">Hết hàng</span>';
  if (c.days < c.lead + 7) return `<span class="chip flag" title="Tồn ${c.stock}, bán ${c.perDay.toFixed(1)}/ngày, về hàng ${c.lead} ngày">Còn ${Math.floor(c.days)} ngày hàng</span>`;
  return '';
}

/* ---------- Sức khoẻ dữ liệu ---------- */
function healthBanner(){
  const y = addDays(todayVN(), -1), miss = [];
  if (!S.prod.has(y)) miss.push('sản phẩm');
  if (!S.ads.has(y)) miss.push('quảng cáo');
  const last = S.lastRaw ? new Date(S.lastRaw) : null;
  const stale = !last || (Date.now() - last.getTime()) > 36*3600e3;
  const noCost = [...(S.prod.get(S.date) || [])].filter(r => r.revP > 0 && !cogsOf(r.id, r.revP, r.units, r.ordP)).length;
  const parts = [];
  if (miss.length) parts.push(`Chưa có số <b>${miss.join(' và ')}</b> ngày ${dm(y)}.`);
  if (stale) parts.push(last ? `Extension gửi dữ liệu lần cuối ${last.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}.` : 'Chưa nhận dữ liệu nào từ extension cho shop này.');
  if (noCost) parts.push(`${noCost} sản phẩm có doanh số nhưng chưa có giá vốn.`);
  if (!parts.length) return '';
  return `<div class="al info" style="margin-bottom:12px"><div style="flex:1">${parts.join(' ')}</div>${noCost ? '<button class="btn sm" data-goto="sku">Nhập giá vốn</button>' : ''}${miss.length || stale ? '<button class="btn sm" data-goto="raw">Xem dữ liệu</button>' : ''}</div>`;
}

function quadChart(rows, medRev, tm){
  if (!rows.length) return '<p class="muted">Chưa có sản phẩm nào đủ giá vốn.</p>';
  const W = 560, H = 300, pl = 48, pr = 12, pt = 12, pb = 30;
  const xs = rows.map(r => r.p.rev), ys = rows.map(r => r.p.lngPct);
  const xmax = Math.max(...xs) * 1.05, ymin = Math.min(-.1, ...ys) - .02, ymax = Math.max(tm + .1, ...ys) + .02;
  const X = v => pl + Math.sqrt(v / xmax) * (W - pl - pr), Y = v => pt + (ymax - v) / (ymax - ymin) * (H - pt - pb);
  const amax = Math.max(1, ...rows.map(r => r.p.ads));
  let s = `<svg class="c" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ma trận doanh số và biên lợi nhuận">`;
  s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}"/><line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(tm)}" y2="${Y(tm)}" stroke-dasharray="4 3"/><line class="grid" x1="${X(medRev)}" x2="${X(medRev)}" y1="${pt}" y2="${H-pb}" stroke-dasharray="4 3"/>`;
  s += `<text x="${pl-6}" y="${Y(0)+4}" text-anchor="end">0%</text><text x="${pl-6}" y="${Y(tm)+4}" text-anchor="end">${Math.round(tm*100)}%</text>`;
  s += `<text x="${W-pr}" y="${H-8}" text-anchor="end">Doanh số →</text><text x="${pl}" y="${H-8}">nhỏ</text>`;
  for (const r of rows){
    const c = r.p.lngPct >= tm ? 'var(--up)' : r.p.lngPct < 0 ? 'var(--down)' : 'var(--flag)';
    const rad = 4 + Math.sqrt(r.p.ads / amax) * 10;
    s += `<circle cx="${X(r.p.rev)}" cy="${Y(r.p.lngPct)}" r="${rad}" fill="${c}" fill-opacity=".55" stroke="${c}" data-pid="${esc(r.id)}" style="cursor:pointer"><title>${esc(r.name)}\nDoanh số ${fmt(r.p.rev,'money')} · LN góp ${fmt(r.p.lngPct,'pct')} · Ads ${fmt(r.p.ads,'money')}</title></circle>`;
  }
  return s + '</svg><p class="muted" style="font-size:12px;margin:4px 0 0">Kích thước chấm = chi phí ads. Đường ngang đứt: mục tiêu biên; đường dọc đứt: doanh số trung vị.</p>';
}

async function importSkus(file){
  const wb = /\.csv$/i.test(file.name)
    ? XLSX.read((await file.text()).replace(/^\uFEFF/,''), { type:'string', raw:true })
    : XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:true });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:'' });
  const spec = {
    id:{ t:[h=>inc(h,'ma san pham'), h=>h==='item id', h=>h==='id'] }, name:{ t:[h=>inc(h,'ten')] },
    cost:{ t:[h=>inc(h,'gia von')&&exc(h,'%','ty le','phan tram')] }, cost_pct:{ t:[h=>inc(h,'gia von')&&(h.includes('%')||inc(h,'ty le')||inc(h,'phan tram'))] },
    price:{ t:[h=>inc(h,'gia ban')] }, brand:{ t:[h=>inc(h,'thuong hieu'), h=>h==='brand'] }, role:{ t:[h=>inc(h,'vai tro')] }, owner:{ t:[h=>inc(h,'phu trach')] },
    stock:{ t:[h=>inc(h,'ton kho'), h=>h==='ton'] }, stock_at:{ t:[h=>inc(h,'ngay dem'), h=>inc(h,'ngay ton')] }, lead_days:{ t:[h=>inc(h,'ve hang'), h=>inc(h,'lead')] },
  };
  const hd = detectHeader(rows, spec); if (hd.idx < 0) throw new Error('Không thấy cột Mã sản phẩm');
  const map = mapColumns(rows[hd.idx], spec);
  if (map.id == null) throw new Error('Không thấy cột Mã sản phẩm');
  const roleOf = v => { const n = norm(v); return Object.entries(ROLES).find(([k,l]) => n === k || n === norm(l))?.[0] || ''; };
  let n = 0;
  for (const r of rows.slice(hd.idx + 1)){
    const id = String(r[map.id] ?? '').trim().replace(/\.0+$/,''); if (!id || !/\d/.test(id)) continue;
    const d = {};
    for (const f of ['cost','cost_pct','price','stock','lead_days']) if (map[f] != null && r[map[f]] !== '') { const v = num(r[map[f]], 'vi'); if (v != null) d[f] = f === 'cost_pct' && v > 0 && v < 1 ? v*100 : v; }
    for (const f of ['brand','owner']) if (map[f] != null && r[map[f]] !== '') d[f] = String(r[map[f]]).trim();
    if (map.role != null && r[map.role] !== '') d.role = roleOf(r[map.role]);
    if (map.stock_at != null && r[map.stock_at] !== '') d.stock_at = pdate(r[map.stock_at]);
    if (map.name != null && r[map.name] && !productIndex().has(id)) d.name = String(r[map.name]).trim();
    if (Object.keys(d).length){ S.skuDirty[id] = { ...(S.skuDirty[id] || {}), ...d }; n++; }
  }
  return n;
}
async function saveSkus(){
  const rows = Object.entries(S.skuDirty).map(([id, d]) => {
    const cur = { ...(S.skus.get(id) || {}), ...d };
    const o = { shop: S.cfg.shop, item_id: id, name: cur.name || productIndex().get(id) || null };
    for (const f of ['cost','cost_pct','price','stock','lead_days']) o[f] = cur[f] === '' || cur[f] == null ? null : +cur[f];
    for (const f of ['brand','role','owner']) o[f] = cur[f] || null;
    o.stock_at = cur.stock_at || null;
    return o;
  });
  for (let i = 0; i < rows.length; i += 200) chk(await sb.from('sv_skus').upsert(rows.slice(i, i+200), { onConflict:'shop,item_id' }));
  for (const r of rows) S.skus.set(r.item_id, r);
  S.skuDirty = {}; clearCalcCache();
  return rows.length;
}

async function readFile(file){
  const name = file.name;
  let rows;
  if (/\.csv$/i.test(name)){
    let text = await file.text(); text = text.replace(/^\uFEFF/,'');
    const wb = XLSX.read(text, { type:'string', raw:true });
    rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:'' });
  } else {
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:true });
    let best = null;
    for (const sn of wb.SheetNames){
      const r = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:true, defval:'' });
      const c = classify(r);
      if (c && (!best || c.ratio > best.c.ratio)) best = { r, c };
      if (!best && !rows) rows = r;
    }
    if (best) rows = best.r;
  }
  return buildPending(name, rows);
}
function buildPending(name, rows, ovIdx){
  const c = classify(rows || []);
  if (!c) return { file:name, err:'Không nhận ra file. Cần file “Hiệu quả sản phẩm”, file quảng cáo hoặc file đơn hàng xuất từ Shopee.', rawRows: rows };
  const ov = {};
  const savedOv = S.cfg.ov?.[c.type] || {};
  for (const k in savedOv) ov[k] = savedOv[k];
  const p = { file:name, type:c.type, hidx:c.idx, rawRows:rows, headers: rows[c.idx].map(String) };
  const applyIdx = (map) => { if (ovIdx) for (const k in ovIdx){ if (ovIdx[k] === '' ) delete map[k]; else map[k] = +ovIdx[k]; } return map; };
  if (c.type === 'prod'){
    let r = parseProd(rows, c.idx, ov);
    if (ovIdx){ const m = applyIdx({ ...r.map }); r = parseWithMap(rows, c.idx, 'prod', m); }
    Object.assign(p, { rows:r.rows, map:r.map });
    p.range = rangeFromName(name) || rangeFromText(rows);
    p.date = p.range && p.range[0] === p.range[1] ? p.range[0] : (p.range ? null : null);
  } else if (c.type === 'ads'){
    let r = parseAds(rows, c.idx, ov);
    if (ovIdx){ const m = applyIdx({ ...r.map }); r = parseWithMap(rows, c.idx, 'ads', m); }
    Object.assign(p, { rows:r.rows, map:r.map });
    p.range = rangeFromText(rows) || rangeFromName(name);
    p.date = p.range && p.range[0] === p.range[1] ? p.range[0] : null;
  } else {
    let r = parseOrders(rows, c.idx, ov);
    if (ovIdx){ const m = applyIdx({ ...r.map }); r = parseWithMap(rows, c.idx, 'ord', m); }
    Object.assign(p, { byDay:r.byDay, map:r.map, count:r.count, days:[...r.byDay.keys()].sort() });
    if (!p.days.length) p.err = 'Không đọc được ngày đặt hàng trong file đơn.';
  }
  p.ok = !p.err;
  p.ovIdx = ovIdx || null;
  return p;
}
/* parse lại với bản đồ cột do người dùng sửa: ghi đè mapColumns bằng chỉ số cột */
function parseWithMap(rows, hidx, type, map){
  const fake = rows.map((r,i) => i === hidx ? r.map((h,j) => '__c' + j) : r);
  const ov = {}; for (const k in map) ov[k] = '__c' + map[k];
  const fn = { prod: parseProd, ads: parseAds, ord: parseOrders }[type];
  const res = fn(fake, hidx, ov);
  res.map = map; return res;
}
async function saveAll(){
  const shop = S.cfg.shop; let n = 0;
  const btn = document.getElementById('saveAll'); if (btn){ btn.disabled = true; btn.textContent = 'Đang lưu…'; }
  try{
    for (const p of S.pending.filter(p => p.ok)){
      if (p.type === 'ord'){
        for (const d of p.days){ await Store.put('ord', safeId(shop+'__'+d), { shop, date:d, orders:p.byDay.get(d), file:p.file, at:Date.now() }); S.ord.set(d, p.byDay.get(d)); }
        n++;

        if (!p.date){ toast(`Chưa chọn ngày cho ${p.file}`); continue; }
        await Store.put(p.type, safeId(shop+'__'+p.date), { shop, date:p.date, rows:p.rows, file:p.file, at:Date.now() });
        (p.type === 'prod' ? S.prod : S.ads).set(p.date, p.rows); n++;
      }
      if (p.ovIdx){
        S.cfg.ov ||= {}; S.cfg.ov[p.type] ||= {};
        for (const k in p.map) S.cfg.ov[p.type][k] = norm(p.headers[p.map[k]]);

    const last = prodDates().at(-1); if (last) S.date = last;
    toast(`Đã lưu ${n} file`);
  }catch(e){ console.error(e); toast('Lưu thất bại: ' + (e.message || e.code || e)); }
  render();
}

function downloadText(name, text, mime){
  (async () => {
    try{
      const dl = window.claude && await window.claude.use('downloads');
      if (dl){ await dl.save({ filename:name, data:new Blob([text], { type:mime }) }); return; }
    }catch(e){ if (e && e.code && e.code !== 'not_granted'){ toast('Không tải được: ' + (e.message||e.code)); return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type:mime })); a.download = name; a.click();
  })();
}
function csvOf(rows){ return '\uFEFF' + rows.map(r => r.map(x => { const s = String(x ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }).join(',')).join('\n'); }

document.addEventListener('click', async e => {
  if (e.target.id === 'logout'){ await sb.auth.signOut(); await Cache.del('daily:' + S.cfg.shop); location.reload(); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = 'Đang đăng nhập…';
  const { data, error } = await sb.auth.signInWithPassword({ email: document.getElementById('lEmail').value.trim(), password: document.getElementById('lPass').value });
  if (error){ btn.disabled = false; btn.textContent = 'Đăng nhập'; document.getElementById('lErr').textContent = 'Sai email hoặc mật khẩu. Tài khoản tạo trong Supabase → Authentication → Users.'; return; }
  S.user = data.user; await afterLogin();
});
function viewLogin(){
  if (!sb) return `<section class="sec" style="max-width:560px;margin:40px auto"><div class="empty"><b>Chưa cấu hình Supabase</b>Mở file index.html, tìm khối CẤU HÌNH ở đầu file và dán SUPABASE_URL cùng SUPABASE_ANON_KEY (Supabase → Settings → API).</div></section>`;
  return `<section class="sec" style="max-width:420px;margin:40px auto"><div class="sec-h"><h2>Đăng nhập</h2></div><form class="sec-b" id="loginForm" style="display:grid;gap:10px">
    <label class="ctl" style="flex-direction:column;align-items:stretch">Email<input type="text" id="lEmail" autocomplete="username" required></label>
    <label class="ctl" style="flex-direction:column;align-items:stretch">Mật khẩu<input type="password" id="lPass" autocomplete="current-password" required style="background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-height:34px"></label>
    <button class="btn pri" type="submit">Đăng nhập</button><div id="lErr" style="color:var(--down);font-size:12.5px"></div></form></section>`;
}
document.getElementById('nav').addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if (b){ S.tab = b.dataset.t; render(); } });
document.getElementById('shopSel').addEventListener('change', async e => { S.cfg.shop = e.target.value; S.pending = []; try { localStorage.setItem('svs-shop', S.cfg.shop); } catch(_){} await loadShop(); render(); });
document.getElementById('dateSel').addEventListener('change', e => { S.date = e.target.value; render(); });

const main = document.getElementById('main');
main.addEventListener('click', async e => {
  const t = e.target.closest('button, tr.click, [data-goto], .drop, circle[data-pid]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.goto){ if (['raw','imp'].includes(ds.goto)){ S.tab = 'data'; S.dataSub = ds.goto; } else S.tab = ds.goto; return render(); }
  if (ds.dsub){ S.dataSub = ds.dsub; return render(); }
  if (ds.pfrange){ S.pfRange = +ds.pfrange; return render(); }
  if (ds.delev){ if (!confirm('Xoá ngày sale này?')) return; chk(await sb.from('sv_events').delete().eq('id', ds.delev)); S.events = S.events.filter(x => x.id !== ds.delev); clearCalcCache(); return render(); }
  if (t.id === 'evAdd'){
    const date = document.getElementById('evDate').value, name = document.getElementById('evName').value.trim(), shop = document.getElementById('evShop').value || null;
    if (!date || !name) return toast('Nhập ngày và tên sự kiện');
    const rec = { id: safeId('ev__' + Date.now()), shop, date, name, kind: 'custom' };
    try { chk(await sb.from('sv_events').insert(rec)); S.events.push(rec); clearCalcCache(); toast('Đã thêm ngày sale'); } catch(err){ toast(err.message); }
    return render();
  }
  if (t.id === 'feeSave'){
    const sh = curShop(); sh.fees = { ...(sh.fees || {}) };
    document.querySelectorAll('[data-fee]').forEach(i => { sh.fees[i.dataset.fee] = i.value === '' ? null : +i.value; });
    try { await saveCfg(); clearCalcCache(); toast('Đã lưu phí sàn'); } catch(err){ toast(err.message); }
    return render();
  }
  if (t.id === 'skuSave'){ t.disabled = true; try { const n = await saveSkus(); toast(`Đã lưu ${n} sản phẩm`); } catch(err){ toast('Lưu thất bại: ' + err.message); } return render(); }
  if (t.id === 'skuImp') return document.getElementById('skuFile').click();
  if (t.id === 'skuTpl'){
    const idx = productIndex(); const ids = [...new Set([...idx.keys(), ...S.skus.keys()])];
    const rows = [['Mã sản phẩm','Tên sản phẩm','Giá vốn/sp','% giá vốn','Giá bán tham khảo','Thương hiệu','Vai trò (Chủ lực/Tăng trưởng/Đuôi/Mới)','Phụ trách','Tồn kho','Ngày đếm tồn','Số ngày về hàng']];
    for (const id of ids){ const k = S.skus.get(id) || {}; rows.push([id, skuName(id), k.cost ?? '', k.cost_pct ?? '', k.price ?? '', k.brand ?? '', k.role ? ROLES[k.role] : '', k.owner ?? '', k.stock ?? '', k.stock_at ?? '', k.lead_days ?? '']); }
    return downloadText(`danh-muc-${S.cfg.shop}.csv`, csvOf(rows), 'text/csv');
  }
  if (t.id === 'csvProfit'){
    const end = S.date, dates = winDates(end, S.pfRange, prodDates()[0]);
    const rows = [['Mã SP','Tên SP','Doanh số','Giá vốn','Phí sàn','Voucher shop','Ads','LN góp','% LN góp','ROAS thực','ROAS hoà vốn','TACoS']];
    for (const id of productIndex().keys()){ const p = profitRange(id, dates); if (!p.rev) continue; rows.push([id, skuName(id), Math.round(p.rev), Math.round(p.cogs), Math.round(p.fees), Math.round(p.vou), Math.round(p.ads), Math.round(p.lng), p.lngPct?.toFixed(4), p.roas?.toFixed(2) ?? '', p.be?.toFixed(2) ?? '', p.tacos?.toFixed(4)]); }
    return downloadText(`loi-nhuan-${S.cfg.shop}-${dates[0]}_${end}.csv`, csvOf(rows), 'text/csv');
  }
  if (ds.cmp){ S.cmp = ds.cmp; return render(); }
  if (ds.prange){ S.prodRange = +ds.prange; return render(); }
  if (ds.arange){ S.adsRange = +ds.arange; return render(); }
  if (ds.vrange){ S.vcRange = +ds.vrange; return render(); }
  if (ds.am){ S.adsMetric = ds.am; return render(); }
  if (ds.pid){ S.prodSel = ds.pid; S.tab = 'prod'; return render(); }
  if (ds.camp){ S.adsSel = ds.camp; render(); document.querySelector('.sec:last-of-type')?.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  if (ds.goprod){ S.prodSel = ds.goprod; S.tab = 'prod'; return render(); }
  if (ds.rmp != null){ S.pending.splice(+ds.rmp, 1); return render(); }
  if (ds.delchg){ if (!confirm('Xoá thay đổi này khỏi nhật ký?')) return; await Store.del('chg', ds.delchg); S.chg = S.chg.filter(c => c._id !== ds.delchg); toast('Đã xoá'); return render(); }
  if (ds.autosave != null){ const a = autoChanges()[+ds.autosave]; if (a) await addChange({ ...a, win:7 }); return; }
  if (ds.rawview){ const r = chk(await sb.from('sv_raw').select('*').eq('id', ds.rawview).single()); S.rawDetail = r; S.rawKind = null; render(); document.querySelector('main .sec:last-of-type')?.scrollIntoView({ behavior:'smooth' }); return; }
  if (ds.rawkind){ S.rawKind = ds.rawkind; return render(); }
  if (t.id === 'rawClose'){ S.rawDetail = null; return render(); }
  if (t.id === 'rawReload'){ S.rawList = null; return render(); }
  if (t.id === 'rawProc'){ t.disabled = true; try { await processPendingRaw(); } catch(e){ toast(e.message); } return render(); }
  if (t.id === 'rawSave'){
    const date = document.getElementById('rawDate').value, shop = document.getElementById('rawShop').value;
    if (!date) return toast('Chọn ngày của số liệu');
    try { const x = await processRaw(S.rawDetail, { date, shop, kind: S.rawKind || S.rawDetail.kind || guessKind(S.rawDetail) }); toast(x.status === 'Đã lưu' ? `Đã lưu ${x.n} dòng vào ${dm(date)}` : x.status); S.rawList = null; S.rawDetail = null; }
    catch(e){ toast('Lưu thất bại: ' + e.message); }
    return render();
  }
  if (t.id === 'drop') return document.getElementById('fileIn').click();
  if (t.id === 'saveAll') return saveAll();
  if (t.id === 'clearPend'){ S.pending = []; return render(); }
  if (t.id === 'addChgHere'){ S.chgDraft = { pid:S.prodSel, date:S.date }; S.tab = 'chg'; return render(); }
  if (t.id === 'cAdd'){
    const c = { date: document.getElementById('cDate').value, pid: document.getElementById('cPid').value, type: document.getElementById('cType').value, win: +document.getElementById('cWin').value || 7, note: document.getElementById('cNote').value.trim() };
    if (!c.date){ toast('Chọn ngày thay đổi'); return; }
    S.chgDraft = null; return addChange(c);
  }
  if (t.id === 'csvDay'){
    const D = S.date, idx = productIndex(), ks = ['imp','clk','ctr','pv','atc','atcR','ord','cr','rev','cost','roas'];
    const rows = [['Ngày','Mã SP','Tên SP',...ks.map(k=>M[k].l)]];
    for (const r of S.prod.get(D) || []){ const x = prodDay(D, r.id); rows.push([D, r.id, idx.get(r.id), ...ks.map(k => x[k] == null ? '' : +x[k].toFixed(M[k].f==='pct'?4:2))]); }
    return downloadText(`san-pham-${D}.csv`, csvOf(rows), 'text/csv');
  }
  if (t.id === 'csvProd'){
    const id = S.prodSel, ks = ['imp','clk','ctr','pv','atc','atcR','ord','cr','rev','cost','roas'];
    const rows = [['Ngày',...ks.map(k=>M[k].l),'Thay đổi']];
    for (const d of prodDates()){ const x = prodDay(d,id); if (x) rows.push([d, ...ks.map(k => x[k] == null ? '' : +x[k].toFixed(M[k].f==='pct'?4:2)), S.chg.filter(c=>c.date===d&&c.pid===id).map(c=>CHG_TYPES[c.type]?.l+': '+c.note).join(' | ')]); }
    return downloadText(`theo-ngay-${id}.csv`, csvOf(rows), 'text/csv');
  }
  if (t.id === 'delBtn'){
    const d = document.getElementById('delDate').value, k = document.getElementById('delKind').value;
    if (!d) return toast('Chọn ngày cần xoá');
    if (!confirm(`Xoá dữ liệu ${k === 'prod' ? 'sản phẩm' : k === 'ads' ? 'quảng cáo' : 'đơn hàng'} ngày ${dm(d)}?`)) return;
    await Store.del(k, safeId(S.cfg.shop+'__'+d)); ({ prod:S.prod, ads:S.ads, ord:S.ord })[k].delete(d); toast('Đã xoá'); return render();
  }
  if (t.id === 'addShop'){
    const n = document.getElementById('newShop').value.trim(); if (!n) return;
    const id = safeId(norm(n).replace(/\s+/g,'-')).slice(0,40) || 'shop' + Date.now();
    if (S.cfg.shops.some(s => s.id === id)) return toast('Shop đã có');
    S.cfg.shops.push({ id, name:n }); S.cfg.shop = id; await saveCfg(); await loadShop(); toast('Đã thêm shop ' + n); return render();
  }
  if (t.id === 'renBtn'){ const n = document.getElementById('renShop').value.trim(); if (!n) return; const sh = S.cfg.shops.find(s => s.id === S.cfg.shop); sh.name = n; sh.shopee_shop_id = document.getElementById('shopeeId').value.trim() || null; await saveCfg(); toast('Đã lưu'); return render(); }
  if (t.id === 'bkOut'){
    const dump = { v:1, at:new Date().toISOString(), cfg:S.cfg };
    for (const k of ['prod','ads','ord','chg']) dump[k] = await Store.list(k);
    return downloadText(`so-van-hanh-san-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(dump), 'application/json');
  }
  if (t.id === 'bkIn') return document.getElementById('bkFile').click();
  if (t.id === 'themeBtn'){
    const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('svs-theme', r.dataset.theme); } catch(e){} return render();
  }
});
main.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'prodSel'){ S.prodSel = t.value; return render(); }
  if (t.dataset.sku != null){ const id = t.dataset.sku; S.skuDirty[id] = { ...(S.skuDirty[id] || {}), [t.dataset.f]: t.value }; const b = document.getElementById('skuSave'); if (b){ b.disabled = false; b.textContent = `Lưu ${Object.keys(S.skuDirty).length} thay đổi`; } t.style.borderColor = 'var(--pri)'; return; }
  if (t.id === 'skuFilter'){ S.skuFilter = t.value; return render(); }
  if (t.id === 'skuFile'){ const f = t.files[0]; t.value = ''; if (!f) return; try { const n = await importSkus(f); toast(`Đã đọc ${n} dòng — kiểm tra rồi bấm Lưu`); } catch(err){ toast(err.message); } return render(); }
  if (t.id === 'evAuto'){ S.cfg.evAuto = t.checked; await saveCfg(); clearCalcCache(); return render(); }
  if (t.dataset.rmap != null || t.dataset.rscale != null){
    const kind = S.rawKind || S.rawDetail.kind || guessKind(S.rawDetail);
    S.cfg.rov ||= {}; S.cfg.rov[kind] ||= { map:{}, scale:{} }; S.cfg.rov[kind].map ||= {}; S.cfg.rov[kind].scale ||= {};
    if (t.dataset.rmap != null) S.cfg.rov[kind].map[t.dataset.rmap] = t.value; else S.cfg.rov[kind].scale[t.dataset.rscale] = +t.value;
    S.rawOpenMap = true; await saveCfg(); return render();
  }
  if (t.id === 'cType'){ document.getElementById('cWin').value = CHG_TYPES[t.value]?.win || 7; return; }
  if (t.dataset.pdate != null){ S.pending[+t.dataset.pdate].date = t.value; return render(); }
  if (t.dataset.ov != null){
    const i = +t.dataset.ov, p = S.pending[i];
    const ovIdx = { ...(p.ovIdx || {}) }; ovIdx[t.dataset.field] = t.value;
    const keepDate = p.date;
    const np = buildPending(p.file, p.rawRows, ovIdx); if (np.type !== 'ord') np.date = keepDate || np.date;
    S.pending[i] = np; return render();
  }
  if (t.id === 'fileIn'){ await ingest([...t.files]); t.value = ''; return; }
  if (t.id === 'bkFile'){
    const f = t.files[0]; if (!f) return;
    try{
      const dump = JSON.parse(await f.text());
      if (!confirm('Khôi phục sẽ ghi các bản ghi trong file sao lưu vào kho hiện tại. Tiếp tục?')) return;
      let n = 0;
      for (const k of ['prod','ads','ord','chg']) for (const r of (dump[k] || [])){ const id = r._id; delete r._id; await Store.put(k, id, r); n++; }
      if (dump.cfg){ S.cfg = { ...S.cfg, ...dump.cfg }; await saveCfg(); }
      await loadShop(); toast(`Đã khôi phục ${n} bản ghi`); render();
    }catch(err){ toast('File sao lưu không hợp lệ'); }
    t.value = '';
  }
});
main.addEventListener('dragover', e => { const d = e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.add('on'); } });
main.addEventListener('dragleave', e => { const d = e.target.closest('#drop'); if (d) d.classList.remove('on'); });
main.addEventListener('drop', e => { const d = e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.remove('on'); ingest([...e.dataTransfer.files]); } });
main.addEventListener('keydown', e => { if (e.target.id === 'drop' && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); document.getElementById('fileIn').click(); } });

async function ingest(files){
  if (typeof XLSX === 'undefined'){ toast('Chưa tải được thư viện đọc Excel, kiểm tra mạng rồi tải lại trang'); return; }
  for (const f of files){
    try { S.pending.push(await readFile(f)); }
    catch(err){ console.error(err); S.pending.push({ file:f.name, err:'Không mở được file: ' + err.message }); }
  }
  render();
}
async function addChange(c){
  const id = safeId(S.cfg.shop + '__' + Date.now());
  const rec = { shop:S.cfg.shop, date:c.date, pid:c.pid, type:c.type, win:c.win, note:c.note || '', at:Date.now() };
  try{ await Store.put('chg', id, rec); S.chg.push({ _id:id, ...rec }); toast('Đã lưu thay đổi'); }
  catch(e){ toast('Lưu thất bại: ' + (e.message || e.code)); }
  render();
}

/* =====================================================================
   KHỞI ĐỘNG
   ===================================================================== */
async function afterLogin(){
  document.getElementById('main').innerHTML = '<div class="empty">Đang đồng bộ dữ liệu…</div>';
  try{
    const c = await Store.get('cfg'); if (c) S.cfg = { ...S.cfg, ...c };
    await loadShop();
    if (!S.prod.size && !S.ads.size && !S.ord.size){ S.tab = 'data'; S.dataSub = 'raw'; }
    render();
    const x = await processPendingRaw(true);
    if (x.saved){ await loadShop(); render(); }
  }catch(e){ console.error(e); document.getElementById('main').innerHTML = `<section class="sec"><div class="empty"><b>Không kết nối được Supabase</b>${esc(e.message)}<br>Kiểm tra đã chạy file supabase.sql chưa.</div></section>`; }
}
(async function boot(){
  try { const th = localStorage.getItem('svs-theme'); if (th) document.documentElement.dataset.theme = th; } catch(e){}
  await Store.init();
  if (!sb){ render(); return; }
  const { data } = await sb.auth.getSession();
  S.user = data.session?.user || null;
  if (!S.user){ render(); return; }
  await afterLogin();
  // dữ liệu extension mới: kiểm tra lại mỗi khi quay lại tab
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !S.user) return;
    try { const x = await processPendingRaw(true); if (x.saved){ Store.mem = {}; await loadShop(); render(); } } catch(e){}
  });
})();
</script>
